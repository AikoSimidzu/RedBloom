      quoteOn = !!m.on;
    },

    /// The header: avatar, title and the model(s) under it.
    head(m) {
      const head = document.getElementById("chathead");
      const av = document.getElementById("headav");
      document.getElementById("headtitle").textContent = m.title || "";
      const sub = document.getElementById("headsub");
      sub.textContent = m.subtitle || "";
      sub.style.display = m.subtitle ? "" : "none";
      if (m.avatar) { av.src = m.avatar; av.hidden = false; } else { av.hidden = true; }
      head.hidden = false;
    },

    /// The shared task list for this chat or room, shown behind the notebook button.
    tasks(m) {
      taskList = Array.isArray(m.list) ? m.list : [];
      taskRoom = !!m.room;
      taskParticipants = Array.isArray(m.participants) ? m.participants : [];
      if (m.statuses) taskStatuses = m.statuses;
      if (m.labels) Object.assign(TL, m.labels);
      renderButtons();
      if (shellOpen() && taskMode === "shared") renderTasks();
    },

    /// Each agent's own notebook, shown behind the people button — pick an agent to see its list.
    agentTasks(m) {
      agentLists = Array.isArray(m.agents) ? m.agents : [];
      if (m.statuses) taskStatuses = m.statuses;
      if (m.labels) Object.assign(TL, m.labels);
      if (!agentLists.some(a => a.name === agentPick)) agentPick = agentLists[0] ? agentLists[0].name : "";
      renderButtons();
      if (shellOpen() && taskMode === "agent") renderTasks();
    },

    /// A file the agent is handing over. Drawn as its own card rather than inside the reply,
    /// because it outlives the sentence that mentioned it — it is still there to open tomorrow.
    shared(m) {
      stopThinking();
      openTurn = null;

      const box = el("div", "gift");
      if (m.note) box.appendChild(el("div", "note", "")).textContent = m.note;

      const strip = el("div", "files");
      for (const file of m.files || []) strip.appendChild(pin(file));
      box.appendChild(strip);

      log.appendChild(box);
      follow();
    },

    /// A picture the agent drew, shown full-size. Clicking opens it in the system viewer.
    image(m) {
      stopThinking();
      openTurn = null;

      const fig = el("figure", "genimg");
      if (m.label) { const cap = el("figcaption", "", ""); cap.textContent = m.label; fig.appendChild(cap); }
      const img = document.createElement("img");
      img.src = m.src || "";
      img.alt = "";
      img.dataset.path = m.path || "";
      img.addEventListener("click", () => openLightbox(img));
      fig.appendChild(img);

      log.appendChild(fig);
      follow();
    },

    /// The agent has been renamed in this chat; every place it is named follows suit.
    rename(m) {
      for (const who of log.querySelectorAll(".turn.agent .who")) who.textContent = m.name || "";
    },

    /// What this turn has cost so far. Marked with a tilde until the endpoint says the figure.
    spend(m) {
      const input = m.input || 0;
      const output = m.output || 0;

      if (!input && !output) { spent.hidden = true; return; }

      spent.hidden = false;
      spent.innerHTML = "";

      const counter = (mark, value) => {
        const box = el("div", "n" + (m.counted ? "" : " est"));
        box.appendChild(el("i", null, "")).textContent = mark;
        box.appendChild(el("b", null, "")).textContent = (m.counted ? "" : "~") + short(value);
        spent.appendChild(box);
      };

      counter("▲", input);
      counter("▼", output);

      spent.title = (m.counted ? S.SpentCounted : S.SpentEstimated)
        + ": " + input + " in, " + output + " out";
    },

    activity(m) {
      stopThinking();
      openTurn = null;
      const node = el("div", "act " + (m.state || "running"));

      const head = el("div", "acthead");
      head.appendChild(el("span", "mark", "▸"));
      head.appendChild(el("span", "label", m.label || ""));
      if (m.what) head.appendChild(el("span", "what", m.what));
      node.appendChild(head);

      // The command sits on its own plate below the label, already syntax-coloured by the host.
      if (m.codeHtml) {
        const pre = el("pre", "cmdcode");
        const code = document.createElement("code");
        code.innerHTML = m.codeHtml;
        pre.appendChild(code);
        node.appendChild(pre);
      }

      node.dataset.id = m.id || "";
      log.appendChild(node);
      follow();
    },

    activityDone(m) {
      const node = [...log.querySelectorAll(".act")].reverse()
        .find((n) => n.dataset.id === (m.id || ""));
      if (node) node.className = "act done";

      // What the command changed, drawn as a diff with per-line +/- and a jump to the file (ПКМ).
      if (m.diffHtml) {
        const diff = el("div", "diff");
        diff.innerHTML = m.diffHtml;

        // A file the agent wrote or edited can be undone: restore the backup, or delete a file it
        // created. Offered as a small button on the diff, gone once used.
        if (m.revert && m.revertPath) {
          const bar = el("div", "revertbar");
          const btn = el("button", "revertbtn", "");
          btn.textContent = S.Revert || "Revert";
          btn.onclick = () => {
            post({ t: "revertFile", path: m.revertPath, token: m.revert });
            btn.disabled = true;
            btn.textContent = S.Reverted || "Reverted";
          };
          bar.appendChild(btn);
          diff.appendChild(bar);
        }

        log.appendChild(diff);
      }

      if (m.output) {
        const box = el("details", "out");
        box.appendChild(el("summary", null, m.summary || "output"));
        const pre = document.createElement("pre");
        pre.textContent = m.output;
        box.appendChild(pre);
        log.appendChild(box);
      }
      follow();
    },

    ask(m) {
      openTurn = null;
      const box = el("div", "ask" + (m.elevated ? " admin" : ""));

      // Elevation is called out above the command, not beside the buttons: it changes what
      // approving means, and it has to be read before the eye reaches "Run".
      if (m.elevated) box.appendChild(el("div", "warn", S.AdminWarn));

      box.appendChild(el("div", "cmd", m.commandHtml));
      const row = el("div", "row");

      const answer = (choice) => {
        post({ t: "approve", answer: choice });
        box.remove();
      };

      const yes = el("button", "yes", S.Run);
      yes.onclick = () => answer("y");
      const no = el("button", null, S.Skip);
      no.onclick = () => answer("n");
      row.appendChild(yes);
      row.appendChild(no);

      if (m.pattern) {
        const always = el("button", null, S.Always);
        always.onclick = () => answer("a");
        row.appendChild(always);
        row.appendChild(el("span", "note", S.AlwaysNote.replace("{0}", m.pattern)));
      }

      box.appendChild(row);
      log.appendChild(box);
      follow();
      yes.focus();
    },

    status(m) {
      status.textContent = m.text || "";
      send.disabled = !!m.busy;

      // While a turn runs the send button has nothing to do, so the stop button stands in its
      // place — one button, whichever action is the live one.
      send.hidden = !!m.busy;
      stop.hidden = !m.busy;

      // Re-armed at the start of every turn: it disables itself once pressed so a second click
      // cannot arrive while the turn is winding down.
      if (m.busy) stop.disabled = false;
    },

    note(m) {
      openTurn = null;
      log.appendChild(el("div", "act done", "<span class=\"mark\">·</span><span>" + m.html + "</span>"));
      follow();
    },
  };

  window.chrome.webview.addEventListener("message", (e) => {
    let message;
    try { message = JSON.parse(e.data); } catch { return; }
    const handler = handlers[message.t];
    if (handler) handler(message);
  });

  // Code-block buttons are handled here rather than with inline handlers, so the generated
  // HTML never needs to carry script.
  log.addEventListener("click", (e) => {
    const button = e.target.closest("button[data-act]");
    if (!button) return;

    if (button.dataset.act === "copy") {
      navigator.clipboard.writeText(button.dataset.code || "").then(() => {
        const was = button.textContent;
        button.textContent = S.Copied;
        setTimeout(() => { button.textContent = was; }, 1200);
      });
      return;
    }

    if (button.dataset.act === "expand") {
      const figure = button.closest("figure.code");
      if (figure) figure.classList.remove("collapsed");
      button.remove();
    }
  });

  function submit() {
    const text = input.value.trim();

    // Pinned tasks travel as structured data, not folded into the text, so the chat can draw them
    // as a card while the host still passes their text to the model.
    const tasks = stagedTasks.map(t => ({ name: t.name, desc: t.desc, state: t.state, assignee: t.assignee }));

    // Nothing typed and nothing pinned is nothing to send.
    if (!text && tasks.length === 0) return;

    // A bare "/command" is run rather than sent as a message.
    if (text && runTypedCommand()) return;

    input.value = "";
    input.style.height = "auto";
    hideMentions();
    hideSlash();
    stagedTasks = [];
    renderStaged();

    // Sending my own message returns the view to the bottom, even if I had scrolled up into the
    // history a moment ago — the reply is what I want to watch for now.
    stuckToBottom = true;

    post({ t: "send", text, tasks, to: pinnedAgent || "", editIndex });
    clearEdit();
  }

  // ---- roleplay quick actions ----

  const rpBar = document.getElementById("rpbar");
  let rpSubject = "me";

  function labelRpBar() {
    const labels = { act: S.RpAct, state: S.RpState, status: S.RpStatus, attempt: S.RpAttempt };
    for (const button of rpBar.querySelectorAll("button[data-rp]")) button.textContent = labels[button.dataset.rp] || "";
    const who = { me: S.RpMe, agent: S.RpAgent };
    for (const button of rpBar.querySelectorAll("button[data-who]")) button.textContent = who[button.dataset.who] || "";
  }

  /** Puts a snippet into the composer on a fresh line, cursor where the caret marker sat. */
  function insertLine(snippet) {
    const caret = snippet.indexOf("│");
    const clean = snippet.replace("│", "");
    const prefix = input.value.length && !input.value.endsWith("\n") ? "\n" : "";
    const at = input.value.length + prefix.length + (caret < 0 ? clean.length : caret);

    input.value += prefix + clean;
    input.focus();
    input.selectionStart = input.selectionEnd = at;
    input.dispatchEvent(new Event("input"));
  }

  rpBar.addEventListener("click", (e) => {
    const who = e.target.closest("button[data-who]");
    if (who) {
      rpSubject = who.dataset.who;
      for (const b of rpBar.querySelectorAll("button[data-who]")) b.classList.toggle("on", b === who);
      return;
    }

    const button = e.target.closest("button[data-rp]");
    if (!button) return;

    const kind = button.dataset.rp;
    const roll = Math.random() < 0.5;

    // "Me": the action is mine, so it is written into my own message, marked with the asterisks
    // roleplay uses for a narrated action, on a fresh line. "Agent": it is a request to the
    // character, sent as an out-of-character line for them to act on.
    if (rpSubject === "me") {
      switch (kind) {
        case "act": insertLine("*│*"); break;
        case "state": insertLine("*" + S.RpStateWord + "│*"); break;
        case "status": insertLine("*" + S.RpStatusWord + "│*"); break;
        case "attempt": insertLine("*" + S.RpAttemptWord + (roll ? S.RpSuccess : S.RpFail) + "*"); break;
      }
      return;
    }

    switch (kind) {
      case "act": post({ t: "send", text: S.RpActPrompt }); break;
      case "state": post({ t: "send", text: S.RpStatePrompt }); break;
      case "status": post({ t: "send", text: S.RpStatusPrompt }); break;
      case "attempt": post({ t: "send", text: roll ? S.RpAttemptOk : S.RpAttemptFail }); break;
    }
  });

  // ---- @-mention picker ----

  const mentionsBox = document.getElementById("mentions");
  const mentionBtn = document.getElementById("mentionBtn");
  const pinBar = document.getElementById("pin");
  let mentionNames = [];
  let mentionMatches = [];
  let mentionAt = 0;

  // The pinned target: while set, every message is addressed to this one agent, until "everyone"
  // is chosen or the chip is cleared. A sentinel stands in for the "everyone" row in the picker,
  // chosen so it can never collide with a real agent name.
  const ALL = "␀all";
  let pinnedAgent = null;

  // How the picker was opened. Typing "@" is a one-off mention written into this message; opening
  // it with the composer button pins a target that holds until it is released.
  let mentionViaButton = false;

  function setPin(name) {
    pinnedAgent = name || null;
    if (!pinnedAgent) { pinBar.hidden = true; pinBar.innerHTML = ""; return; }

    pinBar.innerHTML = "";
    const chip = el("div", "pinchip");
    const arrow = el("span", "pinarrow", ""); arrow.textContent = "→";
    const label = el("span", "pinname", ""); label.textContent = pinnedAgent;
    const x = document.createElement("button");
    x.type = "button";
    x.className = "pinx";
    x.textContent = "✕";
    x.title = S.MentionAllTitle;
    x.addEventListener("mousedown", (e) => { e.preventDefault(); setPin(null); input.focus(); });
    chip.append(arrow, label, x);
    pinBar.appendChild(chip);
    pinBar.hidden = false;
  }

  // ---- editing a past message ----

  const editBar = document.getElementById("editbar");

  // The message being edited, by its position in the history, or -1 when composing anew. On send
  // the host truncates the conversation back to here, so an edit replaces the message and what
  // followed it rather than adding a duplicate at the end.
  let editIndex = -1;

  function startEdit(idx, text) {
    if (idx < 0) return;
    editIndex = idx;
    input.value = text;
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
    input.focus();
    input.selectionStart = input.selectionEnd = input.value.length;
    renderEdit();
  }

  function clearEdit() {
    editIndex = -1;
    renderEdit();
  }

  function renderEdit() {
    editBar.innerHTML = "";
    if (editIndex < 0) { editBar.hidden = true; return; }

    const chip = el("div", "pinchip");
    const mark = el("span", "pinarrow", ""); mark.textContent = "✎";
    const label = el("span", "pinname", ""); label.textContent = S.Editing;
    const x = document.createElement("button");
    x.type = "button";
    x.className = "pinx";
    x.textContent = "✕";
    x.title = S.CancelEdit;
    x.addEventListener("mousedown", (e) => {
      e.preventDefault();
      clearEdit();
      input.value = "";
      input.style.height = "auto";
      input.focus();
    });
    chip.append(mark, label, x);
    editBar.appendChild(chip);
    editBar.hidden = false;
  }

  // The composer button: drops an "@" at the caret and opens the picker to pin a target from.
  mentionBtn.onclick = () => {
    const pos = input.selectionStart;
    const before = input.value.slice(0, pos);
    const lead = before.length && !/\s$/.test(before) ? " " : "";
    input.value = before + lead + "@" + input.value.slice(pos);
    input.selectionStart = input.selectionEnd = pos + lead.length + 1;
    input.focus();
    mentionViaButton = true;
    input.dispatchEvent(new Event("input"));
    updateMentions();
  };

  /** The @-fragment the caret is sitting in, or null when it is not in one. */
  function mentionQuery() {
    if (mentionNames.length === 0) return null;

    const pos = input.selectionStart;
    const head = input.value.slice(0, pos);
    const at = head.lastIndexOf("@");
    if (at < 0) return null;

    // The @ must open a token: at the start, or just after whitespace.
    const before = at === 0 ? " " : head[at - 1];
    if (!/\s/.test(before)) return null;

    const frag = head.slice(at + 1);
    if (frag.includes("\n")) return null;

    return { at, frag };
  }

  function updateMentions() {
    const q = mentionQuery();

    if (!q) { hideMentions(); return; }

    const needle = q.frag.toLowerCase();
    mentionMatches = mentionNames.filter(n => n.toLowerCase().startsWith(needle));

    // An exact single match already fully typed is not worth a popup over.
    if (mentionMatches.length === 0 || (mentionMatches.length === 1 && mentionMatches[0].toLowerCase() === needle)) {
      hideMentions();
      return;
    }

    // On a bare "@" opened by the button, the "everyone" row leads, so a pinned target can be
    // released the same way it was set. Left out when a name is being typed, and out of the inline
    // "@" flow entirely, which is a one-off mention with nothing to release.
    if (mentionViaButton && needle.length === 0) mentionMatches = [ALL, ...mentionMatches];

    mentionAt = 0;
    renderMentions();
    mentionsBox.hidden = false;
  }

  function renderMentions() {
    mentionsBox.innerHTML = "";
    mentionMatches.forEach((name, i) => {
      const isAll = name === ALL;
      const row = el("div", "mrow" + (i === mentionAt ? " active" : "") + (isAll ? " all" : ""));
      row.appendChild(el("span", "dot"));
      const label = el("span", null, "");
      label.textContent = isAll ? S.MentionAll : name;
      row.appendChild(label);
      row.addEventListener("mousedown", (e) => { e.preventDefault(); applyMention(name); });
      mentionsBox.appendChild(row);
    });
  }

  function hideMentions() {
    mentionsBox.hidden = true;
    mentionMatches = [];
    mentionViaButton = false;
  }

  function mentionsOpen() { return !mentionsBox.hidden && mentionMatches.length > 0; }

  function applyMention(name) {
    const viaButton = mentionViaButton;
    const q = mentionQuery();

    if (viaButton) {
      // Opened by the button: pin the target. The "@fragment" typed to filter is removed, so the
      // message stays prose — the target is carried by the chip, not written into the text.
      if (q) {
        const pos = input.selectionStart;
        input.value = input.value.slice(0, q.at) + input.value.slice(pos);
        input.selectionStart = input.selectionEnd = q.at;
      }
      hideMentions();
      // "Everyone" releases the pin; a name sets it, and it holds until changed.
      setPin(name === ALL ? null : name);
    } else {
      // Typed inline: write a one-off "@name" into this message and leave the pin, if any, alone.
      if (!q) { hideMentions(); return; }
      const pos = input.selectionStart;
      const head = input.value.slice(0, q.at) + "@" + name + " ";
      input.value = head + input.value.slice(pos);
      input.selectionStart = input.selectionEnd = head.length;
      hideMentions();
    }

    input.focus();
    input.dispatchEvent(new Event("input"));
  }

  // ---- slash-command picker ----

  const slashBox = document.getElementById("slash");
  let slashCmds = [];
  let slashMatches = [];
  let slashAt = 0;

  // Which commands this surface offers, set by the host: a one-to-one chat enables them, a room
  // leaves them off since compacting and regenerating are not what its shared transcript does.
  let slashEnabled = [];

  /** The commands offered when the composer opens with a "/". Labels are filled from strings. */
  function buildSlashCmds() {
    const all = [
      { id: "compact", name: S.CmdCompact, hint: S.CmdCompactHint, run: () => post({ t: "command", name: "compact" }) },
      { id: "retry", name: S.CmdRetry, hint: S.CmdRetryHint, run: () => post({ t: "regenerate" }) },
    ];
    slashCmds = all.filter(c => slashEnabled.includes(c.id));
  }
  buildSlashCmds();

  /** The command fragment the caret sits in — only when the whole line is a bare "/word". */
  function slashQuery() {
    if (input.value[0] !== "/") return null;
    const pos = input.selectionStart;
    const head = input.value.slice(0, pos);
    // A command is one token at the very start: a space or newline means it is prose, not a command.
    if (/[\s]/.test(head)) return null;
    return head.slice(1);
  }

  function updateSlash() {
    const frag = slashQuery();
    if (frag === null) { hideSlash(); return; }

    const needle = frag.toLowerCase();
    slashMatches = slashCmds.filter(c => c.name.toLowerCase().startsWith(needle));
    if (slashMatches.length === 0) { hideSlash(); return; }

    slashAt = 0;
    renderSlash();
    slashBox.hidden = false;
  }

  function renderSlash() {
    slashBox.innerHTML = "";
    slashMatches.forEach((cmd, i) => {
      const row = el("div", "srow" + (i === slashAt ? " active" : ""));
      const name = el("div", "name", "");
      name.textContent = "/" + cmd.name;
      row.appendChild(name);
      const hint = el("div", "hint", "");
      hint.textContent = cmd.hint;
      row.appendChild(hint);
      row.addEventListener("mousedown", (e) => { e.preventDefault(); applySlash(cmd); });
      slashBox.appendChild(row);
    });
  }

  function hideSlash() { slashBox.hidden = true; slashMatches = []; }
  function slashOpen() { return !slashBox.hidden && slashMatches.length > 0; }

  function applySlash(cmd) {
    hideSlash();
    input.value = "";
    input.style.height = "auto";
    cmd.run();
    input.focus();
  }

  /** Runs a bare "/word" typed and entered without the picker. True when it was a command. */
  function runTypedCommand() {
    if (input.value[0] !== "/") return false;
    const word = input.value.slice(1).trim().toLowerCase();
    const cmd = slashCmds.find(c => c.name.toLowerCase() === word);
    if (!cmd) return false;
    applySlash(cmd);
    return true;
  }

  // ---- selection context menu ----

  const ctxMenu = document.getElementById("ctxmenu");
  let ctxText = "";
  let ctxSpeaker = "";

  function selectionText() {
    const sel = window.getSelection();
    return sel ? sel.toString().trim() : "";
  }

  /** The message the current selection sits in, so a quote of it can be attributed. */
  function selectionSpeaker() {
    const sel = window.getSelection();
    let node = sel && sel.anchorNode;
    while (node && node.nodeType !== 1) node = node.parentNode;
    return speakerOf(node);
  }

  function hideCtx() { ctxMenu.hidden = true; }

  function showCtx(x, y, text, speaker, file) {
    ctxText = text;
    ctxSpeaker = speaker || "";
    ctxMenu.innerHTML = "";

    const add = (label, run, sep) => {
      if (sep) ctxMenu.appendChild(el("div", "csep"));
      const item = el("div", "citem", "");
      item.textContent = label;
      item.addEventListener("mousedown", (e) => { e.preventDefault(); hideCtx(); run(); });
      ctxMenu.appendChild(item);
    };

    // Right-clicking a changed file jumps straight to it, whether or not any text is selected.
    if (file) {
      add(S.CtxGoToFile, () => post({ t: "openFile", path: file }));
    }

    // The text-based items only when something is actually selected.
    if (text) {
      add(S.CtxCopy, () => navigator.clipboard.writeText(ctxText), !!file);
      add(S.CtxImage, () => post({ t: "snapshot", text: ctxText }));
      if (quoteOn) add(S.Quote, () => quoteMessage(ctxSpeaker, ctxText));
      add(S.CtxWeb, () => post({ t: "web", query: ctxText }), true);
      add(S.CtxAsk, () => quoteToComposer(ctxText));
      add(S.CtxAskOther, () => post({ t: "askOther", text: ctxText }));
    }

    ctxMenu.hidden = false;

    // Keep it on screen: nudge back inside the viewport if it would spill off an edge.
    const w = ctxMenu.offsetWidth, h = ctxMenu.offsetHeight;
    ctxMenu.style.left = Math.min(x, window.innerWidth - w - 6) + "px";
    ctxMenu.style.top = Math.min(y, window.innerHeight - h - 6) + "px";
  }

  /** Drops the selected text into the composer as a quote, ready for a question about it. */
  function quoteToComposer(text) {
    const quote = text.split("\n").map(line => "> " + line).join("\n");
    const lead = input.value.length && !input.value.endsWith("\n") ? "\n\n" : "";
    input.value += lead + quote + "\n\n";
    input.focus();
    input.selectionStart = input.selectionEnd = input.value.length;
    input.dispatchEvent(new Event("input"));
  }

  document.addEventListener("contextmenu", (e) => {
    const text = selectionText();
    const fileEl = e.target.closest ? e.target.closest("[data-file]") : null;
    const file = fileEl ? fileEl.dataset.file : "";
    if (!text && !file) { hideCtx(); return; }
    e.preventDefault();
    showCtx(e.clientX, e.clientY, text, selectionSpeaker(), file);
  });

  document.addEventListener("mousedown", (e) => {
    if (!ctxMenu.hidden && !ctxMenu.contains(e.target)) hideCtx();
  });
  document.addEventListener("scroll", hideCtx, true);
  window.addEventListener("blur", hideCtx);

  send.onclick = submit;
  document.getElementById("attachFile").onclick = () => post({ t: "attach" });
  document.getElementById("attachDir").onclick = () => post({ t: "attachFolder" });
  document.getElementById("attachSsh").onclick = () => post({ t: "attachSsh" });

  stop.onclick = () => {
    stop.disabled = true;
    post({ t: "stop" });
  };

  input.addEventListener("keydown", (e) => {
    // While the slash-command picker is open it owns the arrows, Enter/Tab and Escape.
    if (slashOpen()) {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        slashAt = (slashAt + 1) % slashMatches.length;
        renderSlash();
        return;
      }
      if (e.key === "ArrowUp") {
        e.preventDefault();
        slashAt = (slashAt - 1 + slashMatches.length) % slashMatches.length;
        renderSlash();
        return;
      }
      if (e.key === "Enter" || e.key === "Tab") {
        e.preventDefault();
        applySlash(slashMatches[slashAt]);
        return;
      }
      if (e.key === "Escape") {
        e.preventDefault();
        hideSlash();
        return;
      }
    }

    // While the mention picker is open it owns the arrows, Enter/Tab and Escape.
    if (mentionsOpen()) {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        mentionAt = (mentionAt + 1) % mentionMatches.length;
        renderMentions();
        return;
      }
      if (e.key === "ArrowUp") {
        e.preventDefault();
        mentionAt = (mentionAt - 1 + mentionMatches.length) % mentionMatches.length;
        renderMentions();
        return;
      }
      if (e.key === "Enter" || e.key === "Tab") {
        e.preventDefault();
        applyMention(mentionMatches[mentionAt]);
        return;
      }
      if (e.key === "Escape") {
        e.preventDefault();
        hideMentions();
        return;
      }
    }

    // Enter sends; Shift+Enter is how a multi-line question gets written.
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
    updateMentions();
    updateSlash();
  });

  // A click elsewhere, or moving the caret, dismisses the pickers.
  input.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Home" || e.key === "End") {
      updateMentions();
      updateSlash();
    }
  });
  input.addEventListener("blur", () => setTimeout(() => { hideMentions(); hideSlash(); }, 120));

  // ---- task list ----

  const STATES = ["NotStarted", "InProgress", "Done", "NeedsRework", "Tests"];
  let taskList = [];
  let taskRoom = false;
  let taskParticipants = [];
  let taskStatuses = {};
  let agentLists = [];        // [{ name, list: [...] }] — each agent's own notebook
  let agentPick = "";         // which agent's notebook the agent panel is showing
  let taskMode = "shared";    // "shared" (the header list) or "agent" (a notebook)
  let stagedTasks = [];       // tasks pinned to send, shown as chips by the composer

  // A personal, purely-visual filter for the agent notebooks — hide done tasks. Remembered on this
  // machine only, so it survives reopening without touching anything the agents or the room see.
  let agentFilterOpen = false;
  try { agentFilterOpen = localStorage.getItem("rbAgentFilterOpen") === "1"; } catch (e) { /* storage off */ }
  const TL = {};   // labels: tasks, agentTasks, add, del, shareOne, shareAll, shareHeader, none, agentNone, namePh, descPh, unassigned

  // Glyphs by code point rather than typed, so an editor blind to the private-use area leaves
  // them intact: a notebook for the shared list, people for the agents' notebooks.
  const NOTEBOOK = "";
  const AGENTLIST = "";

  const tasksBtn = document.getElementById("tasksBtn");
  const agentTasksBtn = document.getElementById("agentTasksBtn");
  const taskPanel = document.getElementById("taskpanel");
  const taskModal = document.getElementById("taskmodal");
  const taskChips = document.getElementById("taskchips");

  function shellOpen() { return !taskPanel.hidden || !taskModal.hidden; }

  /** Opens the popover (or, as a modal, the centred card) on one of the two lists. */
  function openShell(mode, modal) {
    taskMode = mode;
    if (modal) { taskPanel.hidden = true; taskModal.hidden = false; }
    else { taskModal.hidden = true; taskPanel.hidden = false; }
    tasksBtn.classList.toggle("on", mode === "shared");
    agentTasksBtn.classList.toggle("on", mode === "agent");
    renderTasks();
  }

  function closeTasks() {
    taskPanel.hidden = true; taskModal.hidden = true;
    tasksBtn.classList.remove("on"); agentTasksBtn.classList.remove("on");
  }

  tasksBtn.onclick = () => { (shellOpen() && taskMode === "shared") ? closeTasks() : openShell("shared", false); };
  agentTasksBtn.onclick = () => { (shellOpen() && taskMode === "agent") ? closeTasks() : openShell("agent", false); };
  document.getElementById("taskexpand").onclick = () => openShell(taskMode, true);
  document.getElementById("taskclose").onclick = closeTasks;
  document.getElementById("taskmodalclose").onclick = closeTasks;
  taskModal.addEventListener("mousedown", (e) => { if (e.target === taskModal) closeTasks(); });

  /** The task body of whichever shell is on screen, or null when both are closed. */
  function activeBody() {
    if (!taskModal.hidden) return taskModal.querySelector(".taskbody");
    if (!taskPanel.hidden) return taskPanel.querySelector(".taskbody");
    return null;
  }

  function postTask(op, data) { post(Object.assign({ t: "task", op }, data)); }

  // Sharing no longer types into the composer: the task is pinned as a chip beside the file
  // attachments, and folded into the message only when it is actually sent.
  function stageTask(t, owner) {
    stagedTasks.push({ name: t.name, state: t.state, desc: t.desc, assignee: t.assignee, owner: owner || "" });
    renderStaged();
    closeTasks();
  }

  function stageAll(list) {
    for (const t of list) stagedTasks.push({ name: t.name, state: t.state, desc: t.desc, assignee: t.assignee, owner: "" });
    renderStaged();
    closeTasks();
  }

  function renderStaged() {
    taskChips.innerHTML = "";
    stagedTasks.forEach((t, i) => {
      const chip = el("div", "taskchip");
      const ic = el("span", "tci", ""); ic.textContent = NOTEBOOK; chip.appendChild(ic);
      chip.appendChild(el("span", "tcst st " + t.state));
      const nm = el("span", "tcn", ""); nm.textContent = (t.owner ? t.owner + ": " : "") + (t.name || "(task)"); chip.appendChild(nm);
      const x = el("button", null, "×"); x.title = S.Remove || "Remove";
      x.onclick = () => { stagedTasks.splice(i, 1); renderStaged(); };
      chip.appendChild(x);
      taskChips.appendChild(chip);
    });
  }

  /** A shared task list drawn inside a message as a card, from the structured tasks the host sent. */
  function sharedTasksCard(list) {
    const card = el("div", "sharedtasks");

    for (const t of list) {
      const row = el("div", "stask");
      row.appendChild(el("span", "st " + t.state));

      const body = el("div", "stbody");
      const head = el("div", "sthead");

      const name = el("span", "stname", ""); name.textContent = t.name || "(task)";
      head.appendChild(name);

      const badge = el("span", "stbadge " + t.state, ""); badge.textContent = taskStatuses[t.state] || t.state;
      head.appendChild(badge);

      if (t.assignee) { const who = el("span", "stwho", ""); who.textContent = "@" + t.assignee; head.appendChild(who); }
      body.appendChild(head);

      if (t.desc) { const desc = el("div", "stdesc", ""); desc.textContent = t.desc; body.appendChild(desc); }

      row.appendChild(body);
      card.appendChild(row);
    }

    return card;
  }

  /** The two header buttons: glyph, open-count badge and title. Follows the lists even while shut. */
  function renderButtons() {
    tasksBtn.innerHTML = "";
    const gi = el("span", "ni", ""); gi.textContent = NOTEBOOK; tasksBtn.appendChild(gi);
    const open = taskList.filter(t => t.state !== "Done").length;
    if (taskList.length) { const c = el("span", "nc", ""); c.textContent = open; tasksBtn.appendChild(c); }
    tasksBtn.title = TL.tasks || "Tasks";
    tasksBtn.hidden = false;

    agentTasksBtn.innerHTML = "";
    const ai = el("span", "ni", ""); ai.textContent = AGENTLIST; agentTasksBtn.appendChild(ai);
    const agentOpen = agentLists.reduce((n, a) => n + (a.list ? a.list.filter(t => t.state !== "Done").length : 0), 0);
    if (agentOpen) { const c = el("span", "nc", ""); c.textContent = agentOpen; agentTasksBtn.appendChild(c); }
    agentTasksBtn.title = TL.agentTasks || "Agent notebooks";
    agentTasksBtn.hidden = agentLists.length === 0;

    const title = taskMode === "agent" ? (TL.agentTasks || "Agent notebooks") : (TL.tasks || "Tasks");
    for (const tt of document.querySelectorAll(".taskhead .tt")) tt.textContent = title;
  }

  /** One task row, for either list. `opts.scope === "agent"` routes edits to a notebook. */
  function taskRow(t, opts) {
    const agentEdit = opts.scope === "agent";
    const edit = (fields) => agentEdit
      ? post(Object.assign({ t: "task", op: "update", scope: "agent", agent: opts.agent, id: t.id }, fields))
      : postTask("update", Object.assign({ id: t.id }, fields));

    const row = el("div", "taskrow");
    const top = el("div", "trtop");
    top.appendChild(el("div", "st " + t.state));

    const name = el("div", "tname");
    name.contentEditable = "true"; name.dataset.ph = TL.namePh || "Task"; name.textContent = t.name || "";
    name.addEventListener("blur", () => { if ((t.name || "") !== name.textContent) edit({ name: name.textContent }); });
    top.appendChild(name);

    const acts = el("div", "tacts");
    const share = el("button", null, "&#xE72D;"); share.title = TL.shareOne || "Share";
    share.onmousedown = (e) => { e.preventDefault(); stageTask(t, agentEdit ? opts.agent : ""); };
    const del = el("button", null, "&#xE74D;"); del.title = TL.del || "Delete";
    del.onclick = () => agentEdit
      ? post({ t: "task", op: "delete", scope: "agent", agent: opts.agent, id: t.id })
      : postTask("delete", { id: t.id });
    acts.appendChild(share); acts.appendChild(del);
    top.appendChild(acts);
    row.appendChild(top);

    const desc = el("div", "tdesc");
    desc.contentEditable = "true"; desc.dataset.ph = TL.descPh || "Description"; desc.textContent = t.desc || "";
    desc.addEventListener("blur", () => { if ((t.desc || "") !== desc.textContent) edit({ desc: desc.textContent }); });
    row.appendChild(desc);

    const meta = el("div", "tmeta");
    const stSel = document.createElement("select");
    for (const s of STATES) {
      const o = document.createElement("option");
      o.value = s; o.textContent = taskStatuses[s] || s; if (s === t.state) o.selected = true;
      stSel.appendChild(o);
    }
    stSel.addEventListener("change", () => edit({ state: stSel.value }));
    meta.appendChild(stSel);

    // The assignee picker belongs to the room's shared list; a notebook is one agent's already.
    if (opts.room && !agentEdit) {
      const as = document.createElement("select");
      const zero = document.createElement("option"); zero.value = ""; zero.textContent = TL.unassigned || "—"; as.appendChild(zero);
      for (const p of taskParticipants) {
        const o = document.createElement("option"); o.value = p; o.textContent = p; if (p === t.assignee) o.selected = true; as.appendChild(o);
      }
      as.addEventListener("change", () => postTask("update", { id: t.id, assignee: as.value }));
      meta.appendChild(as);
    }
    row.appendChild(meta);
    return row;
  }

  /** The add-a-task row, wired to whichever list is on screen. */
  function addRow(onAdd) {
    const add = el("div", "taskadd");
    const ni = document.createElement("input"); ni.placeholder = TL.namePh || "Task";
    const btn = el("button", null, ""); btn.textContent = TL.add || "Add";
    const addFn = () => { const v = ni.value.trim(); if (v) { onAdd(v); ni.value = ""; } };
    btn.onclick = addFn;
    ni.addEventListener("keydown", (e) => { if (e.key === "Enter") addFn(); });
    add.appendChild(ni); add.appendChild(btn);
    return add;
  }

  function shareAllFoot(list) {
    const foot = el("div", "taskfoot");
    const sa = el("button", "taskshareall", ""); sa.textContent = TL.shareAll || "Share all";
    sa.onclick = () => { if (list.length) stageAll(list); };
    foot.appendChild(sa);
    return foot;
  }

  function renderTasks() {
    renderButtons();
    const body = activeBody();
    if (!body) return;
    body.innerHTML = "";
    if (taskMode === "agent") renderAgentBody(body); else renderSharedBody(body);
  }

  function renderSharedBody(body) {
    if (!taskList.length) {
      const none = el("div", "tasknone"); none.textContent = TL.none || "No tasks yet."; body.appendChild(none);
    }
    for (const t of taskList) body.appendChild(taskRow(t, { room: taskRoom }));
    body.appendChild(addRow((v) => postTask("add", { name: v })));
    if (taskList.length) body.appendChild(shareAllFoot(taskList));
  }

  function renderAgentBody(body) {
    if (!agentLists.some(a => a.name === agentPick)) agentPick = agentLists[0] ? agentLists[0].name : "";

    // The picker sits at the top: one chip per agent, the chosen one lit. With a single agent it
    // is left out — there is nothing to choose between.
    if (agentLists.length > 1) {
      const pick = el("div", "agentpick");
      for (const a of agentLists) {
        const b = el("button", a.name === agentPick ? "on" : "", ""); b.textContent = a.name;
        b.onclick = () => { agentPick = a.name; renderTasks(); };
        pick.appendChild(b);
      }
      body.appendChild(pick);
    }

    const cur = agentLists.find(a => a.name === agentPick);
    const list = cur && Array.isArray(cur.list) ? cur.list : [];

    // A personal "unfinished only" toggle — hides done tasks in this view, nothing more. Shown
    // whenever there are tasks, so it can be turned on before a list fills with finished ones.
    if (list.length) {
      const filter = el("label", "taskfilter");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = agentFilterOpen;
      cb.addEventListener("change", () => {
        agentFilterOpen = cb.checked;
        try { localStorage.setItem("rbAgentFilterOpen", cb.checked ? "1" : "0"); } catch (e) { /* storage off */ }
        renderTasks();
      });
      filter.appendChild(cb);
      const lbl = el("span", null, ""); lbl.textContent = TL.filterOpen || "Unfinished only"; filter.appendChild(lbl);
      body.appendChild(filter);
    }

    const shown = agentFilterOpen ? list.filter(t => t.state !== "Done") : list;

    if (!shown.length) {
      const none = el("div", "tasknone"); none.textContent = TL.agentNone || "This agent has no tasks yet."; body.appendChild(none);
    }
    for (const t of shown) body.appendChild(taskRow(t, { room: false, scope: "agent", agent: agentPick }));
    body.appendChild(addRow((v) => post({ t: "task", op: "add", scope: "agent", agent: agentPick, name: v })));
    if (shown.length) body.appendChild(shareAllFoot(shown));
  }

  // ---- drag and drop ----

  // Handled inside the page rather than on the WPF side: a windowed WebView2 swallows the native
  // drop before WPF sees it, so the reliable place is here. Files are read and sent to the host,
  // which writes them into the chat's attachment folder and pins them to the composer.
  const dropzone = document.getElementById("dropzone");
  const dzlabel = document.getElementById("dzlabel");
  let dragDepth = 0;

  const hasFiles = (e) => {
    const dt = e.dataTransfer;
    if (!dt) return false;
    if (dt.types) { for (const t of dt.types) if (t === "Files") return true; }
    return false;
  };

  window.addEventListener("dragenter", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth++;
    dropzone.classList.add("on");
  });

  window.addEventListener("dragover", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
  });

  window.addEventListener("dragleave", (e) => {
    if (!hasFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) dropzone.classList.remove("on");
  });

  window.addEventListener("drop", async (e) => {
    dragDepth = 0;
    dropzone.classList.remove("on");
    if (!e.dataTransfer || !e.dataTransfer.files || e.dataTransfer.files.length === 0) return;
    e.preventDefault();

    const files = [...e.dataTransfer.files];
    const out = [];

    for (const f of files) {
      try {
        out.push({ name: f.name, data: await readDataUrl(f) });
      } catch (err) { /* unreadable file, skipped */ }
    }

    if (out.length) post({ t: "drop", files: out });
  });

  function readDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  post({ t: "ready" });
  input.focus();
})();
</script>
</body>
</html>
