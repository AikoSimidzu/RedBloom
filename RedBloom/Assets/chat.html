<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedBloom agent</title>
<style>
  :root {
    --page: transparent;
    --bar: rgba(23, 22, 22, .45);
    --bubble: rgba(30, 28, 28, .45);
    --bubble-user: rgba(140, 43, 51, .28);
    --nick: #ff4d5a;
    --surface: #171616;
    --raised: #1e1c1c;
    --chrome: #221f1f;
    --divider: #2d2d2d;
    --text: #e6e0e0;
    --muted: #a89f9f;
    --faint: #6b6363;
    --accent: #ff4d5a;
    --accent-dim: #8c2b33;
    --ui-font: "Segoe UI", system-ui, sans-serif;
    --code-font: "Cascadia Mono", Consolas, monospace;
    --code-size: 12.5px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--page);
    color: var(--text);
    font-family: var(--ui-font);
    font-size: 13.5px;
  }

  body { display: flex; flex-direction: column; }

  /* ---- transcript ---- */

  #log {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 18px 8px;
    scroll-behavior: smooth;

    /* Chromium rubber-bands the whole surface when a scroll runs past the end, which in a
       hosted WebView reads as the control itself sliding about. Contained scrolling keeps the
       gesture inside this box and stops it bouncing. */
    overscroll-behavior: contain;
  }

  html, body { overscroll-behavior: none; }

  /* A turn is a row: the agent's runs from the left behind its avatar, the user's from the
     right. The text inside each stays left-aligned — right-aligned prose is hard to read once
     it runs past one line. */
  .turn {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 16px;
  }

  .turn.user { flex-direction: row-reverse; }

  .avatar {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--chrome);
    border: 1px solid var(--divider);
  }

  /* The drawn stand-in, used until a picture is chosen. */
  .avatar.blank {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
  }

  .side { min-width: 0; max-width: 82%; }

  /* Only the agent is named. The user knows who they are, and the label was one more thing
     between their question and the answer. */
  .who {
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--nick);
    margin-bottom: 4px;
    font-weight: 600;
  }

  .body { line-height: 1.55; word-wrap: break-word; overflow-wrap: anywhere; }

  /* Both sides speak on a plate; the user's is tinted towards the accent so the two read
     apart at a glance even where the avatar is off screen. */
  .turn .body {
    background: var(--bubble);
    border: 1px solid var(--divider);
    border-radius: 10px;
    padding: 9px 12px;
  }

  .turn.user .body {
    background: var(--bubble-user);
    border-color: var(--accent-dim);
  }
  .body p { margin: 0 0 9px; }
  .body p:last-child { margin-bottom: 0; }
  .body h1, .body h2, .body h3, .body h4, .body h5, .body h6 { margin: 14px 0 7px; font-size: 1.06em; }
  .body ul, .body ol { margin: 0 0 9px; padding-left: 22px; }
  .body li { margin: 2px 0; }
  .body blockquote {
    margin: 0 0 9px;
    padding: 2px 0 2px 11px;
    border-left: 2px solid var(--accent-dim);
    color: var(--muted);
  }
  .body hr { border: 0; border-top: 1px solid var(--divider); margin: 12px 0; }
  .body a { color: var(--accent); }
  .body code {
    font-family: var(--code-font);
    font-size: var(--code-size);
    background: var(--chrome);
    border-radius: 3px;
    padding: 1px 4px;
  }

  /* ---- tables ---- */

  /* Scrolls inside its own box rather than squeezing columns: the chat is a narrow panel, and a
     table of paths or figures stops being a table once the columns are thinner than what is in
     them. The page itself must never scroll sideways. */
  .tablebox { overflow-x: auto; margin: 10px 0; border: 1px solid var(--divider); border-radius: 7px; }

  .tablebox table { border-collapse: collapse; width: 100%; font-size: 12.5px; }

  .tablebox th, .tablebox td {
    padding: 6px 10px;
    text-align: left;
    border-bottom: 1px solid var(--divider);
    vertical-align: top;
    white-space: nowrap;
  }

  .tablebox th {
    background: var(--chrome);
    color: var(--muted);
    font-weight: 600;
    position: sticky;
    top: 0;
  }

  .tablebox tr:last-child td { border-bottom: 0; }
  .tablebox tbody tr:hover td { background: rgba(255, 255, 255, .03); }
  .tablebox .center { text-align: center; }
  .tablebox .right { text-align: right; }

  /* ---- code blocks ---- */

  figure.code {
    margin: 10px 0;
    border: 1px solid var(--divider);
    border-radius: 7px;
    overflow: hidden;
    background: var(--raised);
  }

  figure.code figcaption {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 9px;
    background: var(--chrome);
    border-bottom: 1px solid var(--divider);
    font-size: 11px;
    color: var(--faint);
  }

  figure.code .lang { letter-spacing: .04em; }
  figure.code .tools { display: flex; gap: 6px; }

  figure.code button {
    font: inherit;
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--divider);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
  }
  figure.code button:hover { color: var(--text); border-color: var(--accent); }

  figure.code pre {
    margin: 0;
    padding: 10px 11px;
    overflow-x: auto;
    font-family: var(--code-font);
    font-size: var(--code-size);
    line-height: 1.45;
  }
  figure.code pre code { background: none; padding: 0; }

  /* A long block shows its first lines until asked for the rest. */
  figure.code.collapsed pre { max-height: 17em; overflow-y: hidden; }

  /* ---- what the agent is doing ---- */

  .act {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 5px 0;
    font-size: 12.5px;
    color: var(--muted);
  }

  .act .mark { color: var(--accent); }
  .act.done .mark { color: var(--faint); }
  .act .what { font-family: var(--code-font); font-size: var(--code-size); }

  .act.running .mark { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }

  details.out {
    margin: 2px 0 8px 18px;
    border-left: 1px solid var(--divider);
    padding-left: 10px;
  }
  details.out summary { cursor: pointer; color: var(--faint); font-size: 11.5px; }
  details.out pre {
    margin: 6px 0 0;
    max-height: 22em;
    overflow: auto;
    font-family: var(--code-font);
    font-size: var(--code-size);
    line-height: 1.45;
    color: var(--muted);
    white-space: pre-wrap;
  }

  /* A turn eases in rather than appearing whole, so a long transcript reads as something
     arriving instead of jumping. Kept short — this sits between the question and the answer. */
  .turn, .act, .ask, details.out {
    animation: arrive .22s ease-out;
  }

  @keyframes arrive {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  /* While the reply is still coming, a caret sits at the end of it. The whole answer is
     re-rendered on each repaint, so the caret rides the last element rather than being a
     node of its own that would have to be found and moved. */
  .body.streaming > :last-child::after {
    content: "";
    display: inline-block;
    width: 7px;
    height: 1em;
    margin-left: 2px;
    vertical-align: text-bottom;
    background: var(--nick);
    animation: caret 1s steps(1) infinite;
  }

  @keyframes caret { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }

  /* Movement is decoration; anyone who has asked the system to stop it gets none. */
  @media (prefers-reduced-motion: reduce) {
    .turn, .act, .ask, details.out { animation: none; }
    .body.streaming > :last-child::after,
    .thinking i { animation: none; }
  }

  /* ---- the agent is working ---- */

  /* Shown from the moment a turn starts until its first words land, so the gap between asking
     and reading is something happening rather than nothing. */
  .thinking { display: flex; align-items: center; gap: 6px; padding: 4px 2px; }

  .thinking i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--nick);
    opacity: .3;
    animation: think 1.2s ease-in-out infinite;
  }

  .thinking i:nth-child(2) { animation-delay: .18s; }
  .thinking i:nth-child(3) { animation-delay: .36s; }

  /* The dots say something is happening; this says what. */
  .doing { font-size: 11.5px; color: var(--muted); padding: 0 2px 2px; }

  @keyframes think {
    0%, 80%, 100% { opacity: .25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-3px); }
  }

  /* ---- a file handed over ---- */

  .gift {
    margin: 6px 0 12px;
    padding: 9px 11px;
    border: 1px dashed var(--accent-dim);
    border-radius: 8px;
    background: var(--bubble);
  }

  .gift .note { font-size: 12px; color: var(--muted); margin-bottom: 7px; }

  /* ---- approval ---- */

  .ask {
    margin: 6px 0 10px;
    padding: 10px 12px;
    border: 1px solid var(--accent-dim);
    border-radius: 7px;
    background: var(--raised);
  }
  /* A command asking for administrator rights is a different question from the usual one, so
     the card says so before the command and carries a stronger edge. */
  .ask.admin { border-color: var(--accent); }

  .ask .warn {
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 600;
    margin-bottom: 7px;
  }

  .ask .cmd {
    font-family: var(--code-font);
    font-size: var(--code-size);
    color: var(--text);
    margin-bottom: 9px;
    word-break: break-all;
  }
  .ask .row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .ask button {
    font: inherit;
    font-size: 12px;
    border-radius: 5px;
    padding: 4px 11px;
    cursor: pointer;
    border: 1px solid var(--divider);
    background: transparent;
    color: var(--text);
  }
  .ask button.yes { background: var(--accent-dim); border-color: var(--accent-dim); }
  .ask button:hover { border-color: var(--accent); }
  .ask .note { color: var(--faint); font-size: 11.5px; }

  /* ---- composer ---- */

  #bar {
    border-top: 1px solid var(--divider);
    padding: 9px 12px 11px;
    background: var(--bar);
  }

  #meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 5px;
  }

  #status { font-size: 11.5px; color: var(--faint); min-height: 15px; min-width: 0; }

  /* Which model is answering, changeable mid-conversation. Sits in the bar rather than in a
     settings page because it is a property of this chat, and the reason to change it — a reply
     that wanted a bigger model, or a cheap follow-up — only becomes apparent while reading. */
  #modelPick { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

  #model, #modelText {
    font: inherit;
    font-size: 11px;
    color: var(--faint);
    background: var(--chrome);
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 2px 5px;
    max-width: 190px;
    cursor: pointer;
  }

  #model:hover, #modelText:hover { color: var(--text); border-color: var(--divider); }
  #model:focus, #modelText:focus { outline: none; border-color: var(--accent); color: var(--text); }
  #modelText { cursor: text; }
  #model option { background: var(--chrome); color: var(--text); }

  /* How full the window is. An estimate, so it is a bar rather than a number pretending to
     be exact — it earns its place by warning before a limit, not by being audited. */
  /* What this turn is costing, as it is spent. Beside the context bar because the two answer
     different questions: one is how full the window is, the other is what the answer cost. */
  #spent {
    font-size: 11px;
    color: var(--faint);
    font-family: var(--code-font);
    white-space: nowrap;
    flex: 0 0 auto;
  }

  #gauge { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }

  #track {
    width: 90px;
    height: 4px;
    border-radius: 2px;
    background: var(--chrome);
    overflow: hidden;
  }

  #fill { height: 100%; width: 0; background: var(--accent-dim); transition: width .3s ease; }
  #gauge.high #fill { background: var(--accent); }
  #gaugeText { font-size: 11px; color: var(--faint); white-space: nowrap; }

  /* ---- attachments ---- */

  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
  #chips:empty { display: none; }

  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 260px;
    padding: 3px 6px 3px 9px;
    border: 1px solid var(--divider);
    border-radius: 999px;
    background: var(--bubble);
    font-size: 11.5px;
    color: var(--muted);
  }

  .chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .thumb { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; flex: 0 0 20px; }
  .glyph { font-family: "Segoe MDL2 Assets"; font-size: 13px; color: var(--faint); flex: 0 0 auto; }

  /* An attachment that has been sent: it lives in the message now, and clicking it offers
     the two things anyone wants from a path — the thing itself, or where it lives. */
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

  .pin {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 220px;
    padding: 4px 9px;
    border: 1px solid var(--divider);
    border-radius: 8px;
    background: var(--bubble);
    font-size: 11.5px;
    color: var(--muted);
    cursor: pointer;
  }
  .pin:hover { border-color: var(--accent); color: var(--text); }
  .pin .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pin .thumb { width: 26px; height: 26px; flex: 0 0 26px; }

  .menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    min-width: 150px;
    padding: 4px;
    border: 1px solid var(--divider);
    border-radius: 7px;
    background: var(--chrome);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .5);
  }

  .menu button {
    font: inherit;
    font-size: 12px;
    text-align: left;
    padding: 6px 9px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .menu button:hover { background: var(--bubble-user); }

  .chip button {
    font: inherit;
    font-size: 12px;
    line-height: 1;
    border: 0;
    background: transparent;
    color: var(--faint);
    cursor: pointer;
    padding: 0 2px;
  }
  .chip button:hover { color: var(--accent); }

  /* Icons rather than words: three attach buttons spelled out crowded the composer and pushed
     the text box into a corner. The drawing says what each one takes; the tooltip names it. */
  button.attach {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    flex: 0 0 auto;
    border-radius: 7px;
    border: 1px solid var(--divider);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
  }

  button.attach svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  button.attach:hover { color: var(--accent); border-color: var(--accent); }

  #row { display: flex; gap: 8px; align-items: flex-end; }

  #input {
    flex: 1;
    resize: none;
    min-height: 38px;
    max-height: 180px;
    padding: 9px 11px;
    border-radius: 7px;
    border: 1px solid var(--divider);
    background: var(--raised);
    color: var(--text);
    font: inherit;
    line-height: 1.4;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }

  #send {
    font: inherit;
    padding: 9px 15px;
    border-radius: 7px;
    border: 1px solid var(--accent-dim);
    background: var(--accent-dim);
    color: var(--text);
    cursor: pointer;
  }
  #send:hover { border-color: var(--accent); }
  #send:disabled { opacity: .5; cursor: default; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #3a3636; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div id="log"></div>
  <div id="bar">
    <div id="chips"></div>
    <div id="meta">
      <div id="status"></div>
      <div id="modelPick" hidden>
        <select id="model" title="Model answering this chat"></select>
        <input id="modelText" hidden spellcheck="false" placeholder="model name" />
      </div>
      <span id="spent" hidden></span>
      <div id="gauge" hidden>
        <div id="track"><div id="fill"></div></div>
        <span id="gaugeText"></span>
      </div>
    </div>
    <div id="row">
      <button class="attach" id="attachFile" title="Attach a file" aria-label="Attach a file">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8-8a3.5 3.5 0 1 1 5 5l-8 8a2 2 0 0 1-3-3l7.5-7.5" />
        </svg>
      </button>
      <button class="attach" id="attachDir" title="Attach a folder" aria-label="Attach a folder">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
      </button>
      <button class="attach" id="attachSsh" title="Attach a saved SSH connection" aria-label="Attach an SSH connection">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="4.5" width="19" height="15" rx="2" />
          <path d="M6.5 9.5 9.5 12l-3 2.5M12 15h5" />
        </svg>
      </button>
      <textarea id="input" rows="1" placeholder="Ask the agent…" spellcheck="false"></textarea>
      <button id="send">Send</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const status = document.getElementById("status");

  const chips = document.getElementById("chips");
  const modelPick = document.getElementById("modelPick");
  const modelBox = document.getElementById("model");
  const modelText = document.getElementById("modelText");
  const spent = document.getElementById("spent");
  const gauge = document.getElementById("gauge");
  const fill = document.getElementById("fill");
  const gaugeText = document.getElementById("gaugeText");

  const post = (message) => window.chrome.webview.postMessage(JSON.stringify(message));

  /* Every word the page shows. These are the fallbacks; the app replaces them on startup with
     the same strings in whichever language the window is set to. */
  const S = {
    Ask: "Ask the agent…",
    Send: "Send",
    AttachFile: "Attach a file",
    AttachFolder: "Attach a folder",
    AttachSsh: "Attach a saved SSH connection",
    Remove: "Remove",
    OpenFile: "Open file",
    OpenFolder: "Open folder",
    Reveal: "Show in Explorer",
    Run: "Run",
    Skip: "Skip",
    Always: "Always allow",
    AlwaysNote: "“{0}” from now on",
    AdminWarn: "Asks to run as administrator",
    ModelTitle: "Model answering this chat",
    ModelOther: "Other…",
    ModelPlaceholder: "model name",
    ContextTip: "Estimated context in use",
    SpentCounted: "Counted by the endpoint",
    SpentEstimated: "Estimated while the reply arrives",
    Copied: "copied",
  };

  /** Token counts, short enough to sit in a status line. */
  const short = (n) => (n >= 1000 ? Math.round(n / 1000) + "k" : String(n));

  let stuckToBottom = true;
  log.addEventListener("scroll", () => {
    stuckToBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  });

  // Only follow the tail while the reader is already there; scrolling up to read something
  // must not be undone by the next chunk of a streaming reply.
  const follow = () => { if (stuckToBottom) log.scrollTop = log.scrollHeight; };

  const el = (tag, cls, html) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html !== undefined) node.innerHTML = html;
    return node;
  };

  let openTurn = null;
  let avatarSrc = "";

  /** Sentinel option: the endpoint's list is never exhaustive, so a name can be typed instead. */
  const CUSTOM = "__custom__";
  let current = "";

  modelBox.onchange = () => {
    if (modelBox.value === CUSTOM) {
      modelText.hidden = false;
      modelText.value = current;
      modelText.focus();
      modelText.select();
      return;
    }

    modelText.hidden = true;
    post({ t: "model", name: modelBox.value });
  };

  modelText.onkeydown = (event) => {
    if (event.key === "Enter") {
      const name = modelText.value.trim();
      modelText.hidden = true;
      if (name) post({ t: "model", name });
      else modelBox.value = current;
    } else if (event.key === "Escape") {
      modelText.hidden = true;
      modelBox.value = current;
    }

    event.stopPropagation();
  };

  /** The thumbnail for an attachment, or the glyph standing in for its kind. */
  function face(file) {
    if (file.Preview) {
      const img = document.createElement("img");
      img.className = "thumb";
      img.src = file.Preview;
      img.alt = "";
      return img;
    }

    const mark = el("span", "glyph", "");
    mark.textContent = file.Glyph || "";
    return mark;
  }

  /** An attachment as it appears inside a sent message, with its menu. */
  function pin(file) {
    const node = el("div", "pin");
    node.title = file.Path;
    node.appendChild(face(file));
    node.appendChild(el("span", "name", "")).textContent = file.Name;

    node.onclick = (e) => {
      e.stopPropagation();

      // An attached connection is not a path, so there is nothing to open or reveal.
      if (file.Kind === "ssh") return;

      // Clicking the pin that already has a menu closes it, rather than replacing it with an
      // identical one.
      const open = node.querySelector(".menu");
      closeMenu();
      if (open) return;

      const menu = el("div", "menu");
      const add = (label, how) => {
        const item = el("button", null, label);
        item.onclick = (event) => {
          // Without this the click reaches the pin above, which would close the menu and
          // immediately open a fresh one — so it never looked like it closed at all.
          event.stopPropagation();
          post({ t: "openAttachment", path: file.Path, how });
          closeMenu();
        };
        menu.appendChild(item);
      };

      add(file.Kind === "folder" ? S.OpenFolder : S.OpenFile, "open");
      add(S.Reveal, "reveal");

      node.appendChild(menu);
    };

    return node;
  }

  function closeMenu() {
    for (const m of log.querySelectorAll(".menu")) m.remove();
  }

  document.addEventListener("click", closeMenu);

  /** Removes the working indicator, wherever it got to. */
  function stopThinking() {
    for (const node of log.querySelectorAll('[data-thinking="1"]')) node.remove();
  }

  function avatarFor(who) {
    if (who !== "agent") return null;
    if (avatarSrc) {
      const img = document.createElement("img");
      img.className = "avatar";
      img.src = avatarSrc;
      img.alt = "";
      return img;
    }
    // No picture chosen: a plain mark keeps the row aligned with the ones that have one.
    return el("div", "avatar blank", "\u25c6");
  }

  function turn(who, label) {
    const node = el("div", "turn " + who);

    const face = avatarFor(who);
    if (face) node.appendChild(face);

    const side = el("div", "side");
    if (label) side.appendChild(el("div", "who", label));
    const body = el("div", "body");
    side.appendChild(body);
    node.appendChild(side);

    log.appendChild(node);
    return body;
  }

  const handlers = {
    theme(m) {
      for (const [name, value] of Object.entries(m.vars || {})) {
        document.documentElement.style.setProperty("--" + name, value);
      }
    },

    clear() { log.innerHTML = ""; openTurn = null; },

    avatar(m) { avatarSrc = m.src || ""; },

    /// What is pinned to the composer and not yet sent.
    pending(m) {
      chips.innerHTML = "";
      for (const file of m.files || []) {
        const chip = el("div", "chip");
        chip.title = file.Path;
        chip.appendChild(face(file));
        chip.appendChild(el("span", "name", "")).textContent = file.Name;

        const drop = el("button", null, "×");
        drop.title = S.Remove;
        drop.onclick = () => post({ t: "detach", path: file.Path });
        chip.appendChild(drop);
        chips.appendChild(chip);
      }
    },

    /** The models this endpoint offers, and which one is answering now. */
    models(m) {
      const list = m.list || [];
      current = m.current || "";

      modelPick.hidden = false;
      modelText.hidden = true;
      modelBox.innerHTML = "";

      // The one in use is listed even when the endpoint did not name it: a proxy that serves a
      // model happily while leaving it out of its catalogue is common, and dropping it from the
      // list would look like the chat had silently changed model.
      const names = list.includes(current) || !current ? list.slice() : [current, ...list];

      for (const name of names) {
        const option = el("option");
        option.value = name;
        option.textContent = name;
        modelBox.appendChild(option);
      }

      const other = el("option");
      other.value = CUSTOM;
      other.textContent = S.ModelOther;
      modelBox.appendChild(other);

      modelBox.value = current;
    },

    context(m) {
      const window_ = m.window || 0;
      if (!window_) { gauge.hidden = true; return; }

      const share = Math.min(1, (m.used || 0) / window_);
      gauge.hidden = false;
      gauge.classList.toggle("high", share > 0.7);
      fill.style.width = (share * 100).toFixed(1) + "%";
      gaugeText.textContent = short(m.used || 0) + " / " + short(window_);
      gauge.title = S.ContextTip;
    },

    user(m) {
      openTurn = null;
      const body = turn("user", "");

      if (m.files && m.files.length) {
        const strip = el("div", "files");
        for (const file of m.files) strip.appendChild(pin(file));
        body.appendChild(strip);
      }

      body.appendChild(el("div", null, m.html));
      follow();
    },

    // The assistant's text is replaced wholesale each time rather than appended: the sender
    // re-renders the markdown as it grows, and a half-written fence is not valid on its own.
    assistant(m) {
      stopThinking();
      if (!openTurn) openTurn = turn("agent", m.label || "agent");
      openTurn.innerHTML = m.html;
      openTurn.classList.add("streaming");
      follow();
    },

    endTurn() {
      if (openTurn) openTurn.classList.remove("streaming");
      openTurn = null;
      stopThinking();
    },

    /// What the agent is doing between being asked and writing. Reuses the card already on
    /// screen so the phase changes in place instead of the wait restarting from the bottom.
    thinking(m) {
      if (!m.on) { stopThinking(); return; }

      let node = log.querySelector('[data-thinking="1"]');

      if (!node) {
        node = el("div", "turn agent");
        node.dataset.thinking = "1";
        const face = avatarFor("agent");
        if (face) node.appendChild(face);

        const side = el("div", "side");
        side.appendChild(el("div", "who", ""));
        const dots = el("div", "thinking", "<i></i><i></i><i></i>");
        side.appendChild(dots);
        side.appendChild(el("div", "doing", ""));
        node.appendChild(side);
        log.appendChild(node);
      }

      node.querySelector(".who").textContent = m.label || "";
      node.querySelector(".doing").textContent = m.what || "";
      follow();
    },

    /// The window's language. Applied to what is already on screen as well as kept for what
    /// is drawn later.
    strings(m) {
      Object.assign(S, m.s || {});

      input.placeholder = S.Ask;
      send.textContent = S.Send;
      modelBox.title = S.ModelTitle;
      modelText.placeholder = S.ModelPlaceholder;

      const title = (id, text) => {
        const node = document.getElementById(id);
        node.title = text;
        node.setAttribute("aria-label", text);
      };

      title("attachFile", S.AttachFile);
      title("attachDir", S.AttachFolder);
      title("attachSsh", S.AttachSsh);
    },

    /// A file the agent is handing over. Drawn as its own card rather than inside the reply,
    /// because it outlives the sentence that mentioned it — it is still there to open tomorrow.
    shared(m) {
      stopThinking();
      openTurn = null;

      const box = el("div", "gift");
      if (m.note) box.appendChild(el("div", "note", "")).textContent = m.note;

      const strip = el("div", "files");
      for (const file of m.files || []) strip.appendChild(pin(file));
      box.appendChild(strip);

      log.appendChild(box);
      follow();
    },

    /// The agent has been renamed in this chat; every place it is named follows suit.
    rename(m) {
      for (const who of log.querySelectorAll(".turn.agent .who")) who.textContent = m.name || "";
    },

    /// What this turn has cost so far. Marked with a tilde until the endpoint says the figure.
    spend(m) {
      const input = m.input || 0;
      const output = m.output || 0;

      if (!input && !output) { spent.hidden = true; return; }

      spent.hidden = false;
      spent.textContent = (m.counted ? "" : "~") + "↑" + short(input) + " ↓" + short(output);
      spent.title = (m.counted ? S.SpentCounted : S.SpentEstimated)
        + ": " + input + " in, " + output + " out";
    },

    activity(m) {
      stopThinking();
      openTurn = null;
      const node = el("div", "act " + (m.state || "running"));
      node.appendChild(el("span", "mark", "▸"));
      node.appendChild(el("span", "label", m.label || ""));
      if (m.what) node.appendChild(el("span", "what", m.what));
      node.dataset.id = m.id || "";
      log.appendChild(node);
      follow();
    },

    activityDone(m) {
      const node = [...log.querySelectorAll(".act")].reverse()
        .find((n) => n.dataset.id === (m.id || ""));
      if (node) node.className = "act done";
      if (m.output) {
        const box = el("details", "out");
        box.appendChild(el("summary", null, m.summary || "output"));
        const pre = document.createElement("pre");
        pre.textContent = m.output;
        box.appendChild(pre);
        log.appendChild(box);
      }
      follow();
    },

    ask(m) {
      openTurn = null;
      const box = el("div", "ask" + (m.elevated ? " admin" : ""));

      // Elevation is called out above the command, not beside the buttons: it changes what
      // approving means, and it has to be read before the eye reaches "Run".
      if (m.elevated) box.appendChild(el("div", "warn", S.AdminWarn));

      box.appendChild(el("div", "cmd", m.commandHtml));
      const row = el("div", "row");

      const answer = (choice) => {
        post({ t: "approve", answer: choice });
        box.remove();
      };

      const yes = el("button", "yes", S.Run);
      yes.onclick = () => answer("y");
      const no = el("button", null, S.Skip);
      no.onclick = () => answer("n");
      row.appendChild(yes);
      row.appendChild(no);

      if (m.pattern) {
        const always = el("button", null, S.Always);
        always.onclick = () => answer("a");
        row.appendChild(always);
        row.appendChild(el("span", "note", S.AlwaysNote.replace("{0}", m.pattern)));
      }

      box.appendChild(row);
      log.appendChild(box);
      follow();
      yes.focus();
    },

    status(m) {
      status.textContent = m.text || "";
      send.disabled = !!m.busy;
    },

    note(m) {
      openTurn = null;
      log.appendChild(el("div", "act done", "<span class=\"mark\">·</span><span>" + m.html + "</span>"));
      follow();
    },
  };

  window.chrome.webview.addEventListener("message", (e) => {
    let message;
    try { message = JSON.parse(e.data); } catch { return; }
    const handler = handlers[message.t];
    if (handler) handler(message);
  });

  // Code-block buttons are handled here rather than with inline handlers, so the generated
  // HTML never needs to carry script.
  log.addEventListener("click", (e) => {
    const button = e.target.closest("button[data-act]");
    if (!button) return;

    if (button.dataset.act === "copy") {
      navigator.clipboard.writeText(button.dataset.code || "").then(() => {
        const was = button.textContent;
        button.textContent = S.Copied;
        setTimeout(() => { button.textContent = was; }, 1200);
      });
      return;
    }

    if (button.dataset.act === "expand") {
      const figure = button.closest("figure.code");
      if (figure) figure.classList.remove("collapsed");
      button.remove();
    }
  });

  function submit() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    post({ t: "send", text });
  }

  send.onclick = submit;
  document.getElementById("attachFile").onclick = () => post({ t: "attach" });
  document.getElementById("attachDir").onclick = () => post({ t: "attachFolder" });
  document.getElementById("attachSsh").onclick = () => post({ t: "attachSsh" });

  input.addEventListener("keydown", (e) => {
    // Enter sends; Shift+Enter is how a multi-line question gets written.
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  });

  post({ t: "ready" });
  input.focus();
})();
</script>
</body>
</html>
