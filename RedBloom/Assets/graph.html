<meta charset="utf-8" />
<style>
  :root {
    --page: transparent; --surface: #17181c; --raised: #1e2026; --chrome: #24262e;
    --divider: #33353d; --text: #e8e8ea; --muted: #a9abb3; --faint: #71737b;
    --accent: #e0555f; --accent-dim: #8c2b33; --ui-font: "Segoe UI";
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--ui-font); color: var(--text); }
  body { background: var(--surface); user-select: none; }

  #stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
  #stage.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  #edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #edges path, #edges line { pointer-events: stroke; }
  #edges .hit { stroke: transparent; stroke-width: 16; fill: none; cursor: pointer; }
  #edges text { fill: var(--muted); font-family: var(--ui-font); font-size: 11px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; cursor: pointer; }
  #edges .sel { filter: drop-shadow(0 0 4px var(--accent)); }

  .node {
    position: absolute; width: 176px; min-height: 40px;
    background: var(--raised); border: 1px solid var(--divider); border-left: 3px solid var(--accent);
    border-radius: 9px; padding: 9px 11px; cursor: grab;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 18px rgba(0,0,0,.45); }
  .node .top { display: flex; align-items: center; gap: 7px; }
  .node .ic { font-family: "Segoe MDL2 Assets"; font-size: 13px; color: var(--faint); flex: 0 0 auto; }
  .node .lbl { font-size: 12.5px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .kind { margin-top: 3px; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .node .port {
    position: absolute; right: -8px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface);
    cursor: crosshair; opacity: 0; transition: opacity .12s;
  }
  .node:hover .port, .node.sel .port { opacity: 1; }

  /* toolbar */
  #bar { position: absolute; left: 14px; top: 14px; display: flex; gap: 6px; z-index: 10; }
  #bar button, .ibtn {
    background: var(--chrome); color: var(--muted); border: 1px solid var(--divider);
    border-radius: 7px; padding: 6px 11px; font-family: var(--ui-font); font-size: 12px; cursor: pointer;
  }
  #bar button:hover, .ibtn:hover { color: var(--text); border-color: var(--accent); }
  #hint { position: absolute; left: 14px; bottom: 12px; color: var(--faint); font-size: 11px; z-index: 10; pointer-events: none; }

  /* add menu */
  #menu { position: absolute; z-index: 30; min-width: 200px; max-height: 60vh; overflow: auto;
    background: var(--chrome); border: 1px solid var(--divider); border-radius: 9px; padding: 5px;
    box-shadow: 0 12px 34px rgba(0,0,0,.5); display: none; }
  #menu .mi { padding: 7px 10px; border-radius: 6px; font-size: 12.5px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  #menu .mi:hover { background: var(--raised); }
  #menu .mi .ic { font-family: "Segoe MDL2 Assets"; font-size: 12px; color: var(--faint); }
  #menu .mi .exp { display:inline-block; width:12px; text-align:center; color:var(--faint); font-size:9px; }
  #menu .mi .exp:hover { color:var(--text); }
  #menu .mi.ftree { gap:5px; }
  #menu .grp { padding: 8px 10px 3px; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }

  /* inspector */
  #insp { position: absolute; right: 0; top: 0; bottom: 0; width: 268px; z-index: 20;
    background: var(--surface); border-left: 1px solid var(--divider); padding: 16px; overflow: auto;
    transform: translateX(100%); transition: transform .16s ease; }
  #insp.on { transform: none; }
  #insp h3 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }
  #insp label { display: block; font-size: 11px; color: var(--muted); margin: 12px 0 4px; }
  #insp input[type=text], #insp textarea, #insp select {
    width: 100%; background: var(--raised); border: 1px solid var(--divider); border-radius: 6px;
    color: var(--text); font-family: var(--ui-font); font-size: 12.5px; padding: 6px 8px; }
  #insp textarea { min-height: 62px; resize: vertical; }
  #insp .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  #insp .row label { margin: 0; }
  #insp .swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  #insp .sw { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  #insp .sw.on { border-color: var(--text); }
  #insp .sw.clear { background: var(--raised); border: 1px dashed var(--faint); font-size: 11px; color: var(--faint); display: flex; align-items: center; justify-content: center; }
  #insp .sw.add { position: relative; overflow: hidden; background: var(--raised); border: 1px dashed var(--faint); font-size: 15px; line-height: 1; color: var(--faint); display: flex; align-items: center; justify-content: center; }
  #insp .sw.add:hover { border-color: var(--accent); color: var(--text); }
  #insp .sw.cust { position: relative; }
  #insp .sw.cust .del { position: absolute; top: -5px; right: -5px; width: 13px; height: 13px; border-radius: 50%;
          background: var(--chrome); color: var(--text); border: 1px solid var(--divider); font: normal 10px/11px var(--ui-font);
          text-align: center; display: none; cursor: pointer; }
  #insp .sw.cust:hover .del { display: block; }
  #insp .sw.cust .del:hover { border-color: #ff6b74; color: #ff6b74; }
  #insp .acts { display: flex; gap: 8px; margin-top: 18px; }
  #insp .acts button { flex: 1; padding: 7px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: var(--ui-font); }
  #insp .open { background: var(--accent-dim); color: var(--text); border: 1px solid var(--accent); }
  #insp .del { background: transparent; color: var(--muted); border: 1px solid var(--divider); }
  #insp .del:hover { color: #ff6b74; border-color: #ff6b74; }
  #insp .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--text); cursor: pointer; }
</style>

<div id="stage">
  <div id="world">
    <svg id="edges"></svg>
  </div>
</div>

<div id="bar">
  <button id="add">+ <span id="addLbl">Node</span></button>
  <button id="zin" class="ibtn" title="Zoom in">+</button>
  <button id="zout" class="ibtn" title="Zoom out">&#8722;</button>
  <button id="fit" class="ibtn" title="Fit"><span id="fitLbl">Fit</span></button>
  <button id="exportImg" class="ibtn" title="Export as image" style="font-family:'Segoe MDL2 Assets';font-size:12px">&#xE8B9;</button>
</div>
<div id="hint"></div>
<div id="menu"></div>
<div id="insp"></div>

<script>
  const SVGNS = "http://www.w3.org/2000/svg";
  const post = (m) => window.chrome.webview.postMessage(JSON.stringify(m));
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), world = $("world"), svg = $("edges"), menu = $("menu"), insp = $("insp");

  let S = {
    node: "Node", note: "Note", label: "Label", desc: "Description", connection: "Connection",
    width: "Width", dashed: "Dashed", arrow: "Arrow", color: "Color", none: "Default",
    open: "Open", del: "Delete", edgeHint: "Drag from a node's dot to connect. Click a node or line to edit.",
    kinds: { note: "Note", chat: "Chat", room: "Room", file: "File", milestone: "Milestone" },
  };

  const g = (c) => String.fromCharCode(c);
  const KGLYPH = { note: g(0xE70B), chat: g(0xE8BD), room: g(0xE716), file: g(0xE8A5), source: g(0xE8B7), folder: g(0xE8B7), milestone: g(0xE7C1) };
  const PALETTE = ["", "#e0555f", "#e0913f", "#d8c14a", "#5bb85b", "#4aa6d8", "#7a6ff0", "#c46fd0"];

  let state = { nodes: [], edges: [] };
  let palette = [];
  let folderTree = [];
  let view = { x: 60, y: 60, z: 1 };
  let sel = null;            // { type: "node"|"edge", id }
  const nodeEls = new Map();

  // ---------- transform ----------
  function applyView() { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`; }
  function toWorld(cx, cy) {
    const r = stage.getBoundingClientRect();
    return { x: (cx - r.left - view.x) / view.z, y: (cy - r.top - view.y) / view.z };
  }

  // ---------- rendering ----------
  function render() {
    for (const el of nodeEls.values()) el.remove();
    nodeEls.clear();

    for (const n of state.nodes) world.appendChild(nodeEl(n));
    drawEdges();
    applyView();
  }

  function nodeEl(n) {
    const d = document.createElement("div");
    d.className = "node" + (sel && sel.type === "node" && sel.id === n.id ? " sel" : "");
    d.style.left = n.x + "px";
    d.style.top = n.y + "px";
    if (n.color) d.style.borderLeftColor = n.color;
    d.dataset.id = n.id;

    const top = document.createElement("div"); top.className = "top";
    const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = KGLYPH[n.kind] || KGLYPH.note;
    const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = n.label || (S.kinds[n.kind] || S.note);
    top.appendChild(ic); top.appendChild(lbl);
    d.appendChild(top);

    const kind = document.createElement("div"); kind.className = "kind"; kind.textContent = S.kinds[n.kind] || n.kind;
    d.appendChild(kind);

    const port = document.createElement("div"); port.className = "port"; d.appendChild(port);
    port.addEventListener("pointerdown", (e) => startConnect(e, n));

    d.addEventListener("pointerdown", (e) => startNodeDrag(e, n, d));
    nodeEls.set(n.id, d);
    return d;
  }

  function rectOf(id) {
    const el = nodeEls.get(id);
    const n = state.nodes.find((x) => x.id === id);
    if (!el || !n) return null;
    return { cx: n.x + el.offsetWidth / 2, cy: n.y + el.offsetHeight / 2, w: el.offsetWidth, h: el.offsetHeight };
  }

  // Point where the centre-line leaves a node's rectangle, so a line meets the box edge.
  function border(r, tx, ty) {
    const dx = tx - r.cx, dy = ty - r.cy;
    if (dx === 0 && dy === 0) return { x: r.cx, y: r.cy };
    const s = (Math.abs(dx) * r.h > Math.abs(dy) * r.w) ? (r.w / 2) / Math.abs(dx) : (r.h / 2) / Math.abs(dy);
    return { x: r.cx + dx * s, y: r.cy + dy * s };
  }

  function drawEdges() {
    svg.textContent = "";

    for (const e of state.edges) {
      const a = rectOf(e.from), b = rectOf(e.to);
      if (!a || !b) continue;

      const p1 = border(a, b.cx, b.cy), p2 = border(b, a.cx, a.cy);
      const color = e.color || "var(--accent)";
      const selected = sel && sel.type === "edge" && sel.id === e.id;

      const line = document.createElementNS(SVGNS, "line");
      line.setAttribute("x1", p1.x); line.setAttribute("y1", p1.y);
      line.setAttribute("x2", p2.x); line.setAttribute("y2", p2.y);
      line.setAttribute("stroke", color);
      line.setAttribute("stroke-width", e.width || 2);
      if (e.dashed) line.setAttribute("stroke-dasharray", "7 5");
      line.setAttribute("stroke-linecap", "round");
      if (selected) line.setAttribute("class", "sel");
      svg.appendChild(line);

      if (e.directed) svg.appendChild(arrow(p1, p2, color, e.width || 2));

      // A fat invisible line for easy clicking.
      const hit = document.createElementNS(SVGNS, "line");
      hit.setAttribute("x1", p1.x); hit.setAttribute("y1", p1.y);
      hit.setAttribute("x2", p2.x); hit.setAttribute("y2", p2.y);
      hit.setAttribute("class", "hit");
      hit.addEventListener("pointerdown", (ev) => { ev.stopPropagation(); select("edge", e.id); });
      svg.appendChild(hit);

      if (e.label) {
        const t = document.createElementNS(SVGNS, "text");
        t.setAttribute("x", (p1.x + p2.x) / 2); t.setAttribute("y", (p1.y + p2.y) / 2 - 5);
        t.setAttribute("text-anchor", "middle");
        t.textContent = e.label;
        t.addEventListener("pointerdown", (ev) => { ev.stopPropagation(); select("edge", e.id); });
        svg.appendChild(t);
      }
    }
  }

  function arrow(p1, p2, color, w) {
    const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    const size = 7 + w * 1.5;
    const a1 = ang + Math.PI - 0.42, a2 = ang + Math.PI + 0.42;
    const poly = document.createElementNS(SVGNS, "polygon");
    poly.setAttribute("points",
      `${p2.x},${p2.y} ${p2.x + Math.cos(a1) * size},${p2.y + Math.sin(a1) * size} ${p2.x + Math.cos(a2) * size},${p2.y + Math.sin(a2) * size}`);
    poly.setAttribute("fill", color);
    return poly;
  }

  // ---------- export as image ----------
  function cssVar(name, fb) { const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fb; }
  function roundRectPath(ctx, x, y, w, hh, r) { r = Math.min(r, w / 2, hh / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function fitText(ctx, text, maxW) { if (ctx.measureText(text).width <= maxW) return text; let t = text; while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1); return t + "…"; }
  function exportImage() {
    if (!state.nodes.length) return;
    const boxes = state.nodes.map((n) => { const el = nodeEls.get(n.id); return { n, x: n.x, y: n.y, w: el ? el.offsetWidth : 176, h: el ? el.offsetHeight : 48 }; });
    const pad = 44;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const b of boxes) { minX = Math.min(minX, b.x); minY = Math.min(minY, b.y); maxX = Math.max(maxX, b.x + b.w); maxY = Math.max(maxY, b.y + b.h); }
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    const W = Math.max(1, Math.ceil(maxX - minX)), H = Math.max(1, Math.ceil(maxY - minY)), scale = 2;
    const cv = document.createElement("canvas"); cv.width = W * scale; cv.height = H * scale;
    const ctx = cv.getContext("2d"); ctx.scale(scale, scale); ctx.translate(-minX, -minY);
    const uiFont = cssVar("--ui-font", "sans-serif");
    const col = { bg: cssVar("--surface", "#191919"), raised: cssVar("--raised", "#242424"), divider: cssVar("--divider", "#333"),
                  accent: cssVar("--accent", "#7a6ff0"), text: cssVar("--text", "#eee"), muted: cssVar("--muted", "#aaa"), faint: cssVar("--faint", "#888") };
    ctx.fillStyle = col.bg; ctx.fillRect(minX, minY, W, H);
    const rect = (id) => { const b = boxes.find((x) => x.n.id === id); return b ? { cx: b.x + b.w / 2, cy: b.y + b.h / 2, w: b.w, h: b.h } : null; };
    const brd = (r, tx, ty) => { const dx = tx - r.cx, dy = ty - r.cy; if (!dx && !dy) return { x: r.cx, y: r.cy };
      const s = (Math.abs(dx) * r.h > Math.abs(dy) * r.w) ? (r.w / 2) / Math.abs(dx) : (r.h / 2) / Math.abs(dy); return { x: r.cx + dx * s, y: r.cy + dy * s }; };
    for (const e of state.edges) { const a = rect(e.from), b = rect(e.to); if (!a || !b) continue;
      const p1 = brd(a, b.cx, b.cy), p2 = brd(b, a.cx, a.cy), color = e.color || col.accent, w = e.width || 2;
      ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.setLineDash(e.dashed ? [7, 5] : []);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); ctx.setLineDash([]);
      if (e.directed) { const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x), size = 7 + w * 1.5, a1 = ang + Math.PI - 0.42, a2 = ang + Math.PI + 0.42;
        ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(p2.x, p2.y); ctx.lineTo(p2.x + Math.cos(a1) * size, p2.y + Math.sin(a1) * size); ctx.lineTo(p2.x + Math.cos(a2) * size, p2.y + Math.sin(a2) * size); ctx.closePath(); ctx.fill(); }
      if (e.label) { const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2 - 5; ctx.font = "11px " + uiFont; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
        ctx.lineWidth = 3; ctx.strokeStyle = col.bg; ctx.strokeText(e.label, mx, my); ctx.fillStyle = col.muted; ctx.fillText(e.label, mx, my); ctx.textAlign = "left"; } }
    for (const b of boxes) { const n = b.n, color = n.color || col.accent;
      roundRectPath(ctx, b.x, b.y, b.w, b.h, 9); ctx.fillStyle = col.raised; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = col.divider; ctx.stroke();
      ctx.save(); roundRectPath(ctx, b.x, b.y, b.w, b.h, 9); ctx.clip(); ctx.fillStyle = color; ctx.fillRect(b.x, b.y, 3, b.h); ctx.restore();
      const ix = b.x + 12, iy = b.y + 11, kindTxt = (S.kinds && S.kinds[n.kind]) || n.kind;
      ctx.textBaseline = "top"; ctx.font = '13px "Segoe MDL2 Assets"'; ctx.fillStyle = col.faint; ctx.fillText(KGLYPH[n.kind] || KGLYPH.note, ix, iy + 1);
      const tx = ix + 19; ctx.font = '600 12.5px ' + uiFont; ctx.fillStyle = col.text; ctx.fillText(fitText(ctx, n.label || kindTxt, b.w - (tx - b.x) - 11), tx, iy);
      ctx.font = '10px ' + uiFont; ctx.fillStyle = col.faint; ctx.fillText(fitText(ctx, String(kindTxt).toUpperCase(), b.w - 24), b.x + 12, iy + 20); }
    post({ t: "exportImage", data: cv.toDataURL("image/png") });
  }

  // ---------- interaction: pan / zoom ----------
  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".node") || e.target.closest("#insp") || e.target.closest("#bar") || e.target.closest("#menu")) return;
    if (e.target.tagName === "line" || e.target.tagName === "text") return;
    select(null);
    hideMenu();
    const start = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    stage.classList.add("panning");
    stage.setPointerCapture(e.pointerId);
    const move = (ev) => { view.x = start.vx + (ev.clientX - start.x); view.y = start.vy + (ev.clientY - start.y); applyView(); };
    const up = () => { stage.classList.remove("panning"); stage.removeEventListener("pointermove", move); stage.removeEventListener("pointerup", up); };
    stage.addEventListener("pointermove", move);
    stage.addEventListener("pointerup", up);
  });

  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    const nz = Math.min(2.5, Math.max(0.25, view.z * factor));
    // Keep the point under the cursor fixed.
    view.x = mx - (mx - view.x) * (nz / view.z);
    view.y = my - (my - view.y) * (nz / view.z);
    view.z = nz;
    applyView();
  }, { passive: false });

  $("zin").onclick = () => zoomBy(1.15);
  $("zout").onclick = () => zoomBy(1 / 1.15);
  function zoomBy(f) {
    const r = stage.getBoundingClientRect(), mx = r.width / 2, my = r.height / 2;
    const nz = Math.min(2.5, Math.max(0.25, view.z * f));
    view.x = mx - (mx - view.x) * (nz / view.z); view.y = my - (my - view.y) * (nz / view.z); view.z = nz; applyView();
  }
  $("fit").onclick = fit;
  $("exportImg").onclick = () => exportImage();

  function fit() {
    if (state.nodes.length === 0) { view = { x: 60, y: 60, z: 1 }; applyView(); return; }
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const n of state.nodes) {
      const el = nodeEls.get(n.id); const w = el ? el.offsetWidth : 176, h = el ? el.offsetHeight : 48;
      minx = Math.min(minx, n.x); miny = Math.min(miny, n.y); maxx = Math.max(maxx, n.x + w); maxy = Math.max(maxy, n.y + h);
    }
    const r = stage.getBoundingClientRect(), pad = 60;
    const z = Math.min(2, Math.max(0.3, Math.min((r.width - pad * 2) / (maxx - minx || 1), (r.height - pad * 2) / (maxy - miny || 1))));
    view.z = z;
    view.x = pad - minx * z + (r.width - pad * 2 - (maxx - minx) * z) / 2;
    view.y = pad - miny * z + (r.height - pad * 2 - (maxy - miny) * z) / 2;
    applyView();
  }

  // ---------- interaction: node drag ----------
  function startNodeDrag(e, n, d) {
    if (e.target.classList.contains("port")) return;
    e.stopPropagation();
    d.setPointerCapture(e.pointerId);
    const startW = toWorld(e.clientX, e.clientY);
    const orig = { x: n.x, y: n.y };
    let moved = false;
    const move = (ev) => {
      const w = toWorld(ev.clientX, ev.clientY);
      n.x = orig.x + (w.x - startW.x); n.y = orig.y + (w.y - startW.y);
      d.style.left = n.x + "px"; d.style.top = n.y + "px";
      moved = true; drawEdges();
    };
    const up = () => {
      d.removeEventListener("pointermove", move); d.removeEventListener("pointerup", up);
      if (moved) save(); else select("node", n.id);
    };
    d.addEventListener("pointermove", move);
    d.addEventListener("pointerup", up);
  }

  // ---------- interaction: connect ----------
  function startConnect(e, from) {
    e.stopPropagation();
    const temp = document.createElementNS(SVGNS, "line");
    temp.setAttribute("stroke", "var(--accent)"); temp.setAttribute("stroke-width", "2"); temp.setAttribute("stroke-dasharray", "5 4");
    svg.appendChild(temp);
    const a = rectOf(from.id);
    stage.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const w = toWorld(ev.clientX, ev.clientY);
      const p = border(a, w.x, w.y);
      temp.setAttribute("x1", p.x); temp.setAttribute("y1", p.y);
      temp.setAttribute("x2", w.x); temp.setAttribute("y2", w.y);
    };
    const up = (ev) => {
      stage.removeEventListener("pointermove", move); stage.removeEventListener("pointerup", up);
      temp.remove();
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const targetEl = el && el.closest(".node");
      if (targetEl && targetEl.dataset.id && targetEl.dataset.id !== from.id) {
        const edge = { id: uid(), from: from.id, to: targetEl.dataset.id, label: "", note: "", color: "", width: 2, dashed: false, directed: true };
        state.edges.push(edge); render(); select("edge", edge.id); save();
      }
    };
    stage.addEventListener("pointermove", move);
    stage.addEventListener("pointerup", up);
  }

  // ---------- selection + inspector ----------
  function select(type, id) {
    sel = type ? { type, id } : null;
    render();
    drawInspector();
  }

  function drawInspector() {
    if (!sel) { insp.classList.remove("on"); insp.innerHTML = ""; return; }
    insp.classList.add("on");
    insp.innerHTML = "";

    if (sel.type === "node") { inspectNode(state.nodes.find((n) => n.id === sel.id)); }
    else { inspectEdge(state.edges.find((e) => e.id === sel.id)); }
  }

  function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function lab(t) { return h("label", null, t); }

  function customColors() { try { return JSON.parse(localStorage.getItem("rb.customColors") || "[]"); } catch (_) { return []; } }
  function saveCustom(c) { if (!c || c[0] !== "#" || PALETTE.includes(c)) return; const list = customColors(); if (!list.includes(c)) { list.push(c); while (list.length > 12) list.shift(); localStorage.setItem("rb.customColors", JSON.stringify(list)); } }
  function removeCustom(c) { localStorage.setItem("rb.customColors", JSON.stringify(customColors().filter((x) => x !== c))); }
  function swatches(current, onPick) {
    const wrap = h("div", "swatches");
    for (const c of PALETTE) {
      const s = h("div", "sw" + (current === c ? " on" : "") + (c === "" ? " clear" : ""));
      if (c) s.style.background = c; else s.textContent = "×";
      s.title = c || S.none;
      s.onclick = () => onPick(c);
      wrap.appendChild(s);
    }
    // Saved custom colours: each carries its own delete badge on hover.
    for (const c of customColors()) {
      const s = h("div", "sw cust" + (current === c ? " on" : "")); s.style.background = c; s.title = c; s.onclick = () => onPick(c);
      const x = h("i", "del", "×"); x.title = S.removeColor || "Remove colour"; x.onclick = (ev) => { ev.stopPropagation(); removeCustom(c); drawInspector(); };
      s.appendChild(x); wrap.appendChild(s);
    }
    // Separate button: pick any colour from the system palette and keep it as a reusable swatch.
    const add = h("div", "sw add", "+"); add.title = S.customColor || "Custom colour";
    const inp = h("input"); inp.type = "color"; inp.value = (current && current[0] === "#") ? current : "#7a6ff0";
    inp.style.cssText = "position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0";
    inp.onchange = () => { saveCustom(inp.value); onPick(inp.value); };
    add.appendChild(inp); wrap.appendChild(add);
    return wrap;
  }

  function inspectNode(n) {
    if (!n) return;
    insp.appendChild(h("h3", null, S.node));

    insp.appendChild(lab(S.label));
    const label = h("input"); label.type = "text"; label.value = n.label;
    label.oninput = () => { n.label = label.value; nodeEls.get(n.id).querySelector(".lbl").textContent = n.label || (S.kinds[n.kind] || S.note); drawEdges(); saveSoon(); };
    insp.appendChild(label);

    insp.appendChild(lab(S.desc));
    const note = h("textarea"); note.value = n.note;
    note.oninput = () => { n.note = note.value; saveSoon(); };
    insp.appendChild(note);

    insp.appendChild(lab(S.color));
    insp.appendChild(swatches(n.color, (c) => { n.color = c; render(); select("node", n.id); save(); }));

    const acts = h("div", "acts");
    if (n.refId) {
      const open = h("button", "open", S.open);
      open.onclick = () => post({ t: "open", kind: n.kind, refId: n.refId });
      acts.appendChild(open);
    }
    const del = h("button", "del", S.del);
    del.onclick = () => { state.edges = state.edges.filter((e) => e.from !== n.id && e.to !== n.id); state.nodes = state.nodes.filter((x) => x.id !== n.id); select(null); save(); };
    acts.appendChild(del);
    insp.appendChild(acts);
  }

  function inspectEdge(e) {
    if (!e) return;
    insp.appendChild(h("h3", null, S.connection));

    insp.appendChild(lab(S.label));
    const label = h("input"); label.type = "text"; label.value = e.label;
    label.oninput = () => { e.label = label.value; drawEdges(); saveSoon(); };
    insp.appendChild(label);

    insp.appendChild(lab(S.desc));
    const note = h("textarea"); note.value = e.note;
    note.oninput = () => { e.note = note.value; saveSoon(); };
    insp.appendChild(note);

    insp.appendChild(lab(S.color));
    insp.appendChild(swatches(e.color, (c) => { e.color = c; drawEdges(); save(); }));

    insp.appendChild(lab(S.width));
    const wsel = h("select");
    for (const w of [1, 2, 3, 4, 6]) { const o = h("option", null, w + " px"); o.value = w; if (e.width === w) o.selected = true; wsel.appendChild(o); }
    wsel.onchange = () => { e.width = parseInt(wsel.value, 10); drawEdges(); save(); };
    insp.appendChild(wsel);

    const dash = h("label", "check");
    const dc = h("input"); dc.type = "checkbox"; dc.checked = e.dashed;
    dc.onchange = () => { e.dashed = dc.checked; drawEdges(); save(); };
    dash.appendChild(dc); dash.appendChild(h("span", null, S.dashed));
    insp.appendChild(dash);

    const dir = h("label", "check");
    const arc = h("input"); arc.type = "checkbox"; arc.checked = e.directed;
    arc.onchange = () => { e.directed = arc.checked; drawEdges(); save(); };
    dir.appendChild(arc); dir.appendChild(h("span", null, S.arrow));
    insp.appendChild(dir);

    const acts = h("div", "acts");
    const del = h("button", "del", S.del);
    del.onclick = () => { state.edges = state.edges.filter((x) => x.id !== e.id); select(null); save(); };
    acts.appendChild(del);
    insp.appendChild(acts);
  }

  // ---------- add menu ----------
  $("add").onclick = (ev) => {
    ev.stopPropagation();
    menu.innerHTML = "";
    const addNote = h("div", "mi");
    addNote.appendChild(Object.assign(h("span", "ic"), { textContent: KGLYPH.note }));
    addNote.appendChild(h("span", null, S.note));
    addNote.onclick = () => { addNode("note", "", ""); hideMenu(); };
    menu.appendChild(addNote);

    const groups = { chat: [], room: [], file: [], source: [] };
    for (const p of palette) if (groups[p.kind]) groups[p.kind].push(p);
    for (const kind of ["source", "chat", "room", "file"]) {
      const items = groups[kind].filter((p) => !state.nodes.some((n) => n.kind === kind && n.refId === p.refId));
      if (items.length === 0) continue;
      menu.appendChild(h("div", "grp", S.kinds[kind]));
      for (const p of items) {
        const mi = h("div", "mi");
        mi.appendChild(Object.assign(h("span", "ic"), { textContent: KGLYPH[kind] }));
        mi.appendChild(h("span", null, p.label));
        mi.onclick = () => { addNode(kind, p.refId, p.label); hideMenu(); };
        menu.appendChild(mi);
      }
    }
    renderFolderMenu();

    const r = $("add").getBoundingClientRect();
    menu.style.left = r.left + "px"; menu.style.top = (r.bottom + 6) + "px"; menu.style.display = "block";
  };
  function hideMenu() { menu.style.display = "none"; }
  function renderFolderMenu() {
    for (const src of folderTree) {
      if (!src.folders || !src.folders.length) continue;
      menu.appendChild(h("div", "grp", (S.kinds.folder || "Folders") + " · " + src.source));
      for (const f of src.folders) menu.appendChild(folderRow(f, 0));
    }
  }
  function folderRow(node, depth) {
    const mi = h("div", "mi ftree"); mi.style.paddingLeft = (8 + depth * 14) + "px";
    mi._node = node; mi._depth = depth; mi._kids = []; mi._open = false;
    const has = node.children && node.children.length;
    const exp = h("span", "exp"); exp.textContent = has ? "▸" : ""; mi._exp = exp;
    if (has) exp.onclick = (e) => { e.stopPropagation(); mi._open ? collapseRow(mi) : expandRow(mi); };
    mi.appendChild(exp);
    mi.appendChild(Object.assign(h("span", "ic"), { textContent: KGLYPH.folder }));
    mi.appendChild(h("span", null, node.name));
    mi.onclick = () => { addNode("folder", node.path, node.name); hideMenu(); };
    return mi;
  }
  function expandRow(mi) {
    let after = mi;
    for (const child of mi._node.children) { const row = folderRow(child, mi._depth + 1); after.after(row); after = row; mi._kids.push(row); }
    mi._open = true; mi._exp.textContent = "▾";
  }
  function collapseRow(mi) {
    for (const c of mi._kids) { if (c._open) collapseRow(c); c.remove(); }
    mi._kids = []; mi._open = false; mi._exp.textContent = "▸";
  }

  function addNode(kind, refId, label) {
    const r = stage.getBoundingClientRect();
    const c = toWorld(r.left + r.width / 2, r.top + r.height / 2);
    const n = { id: uid(), kind, refId, label, note: "", color: "", x: Math.round(c.x - 88), y: Math.round(c.y - 24) };
    state.nodes.push(n); render(); select("node", n.id); save();
  }

  // ---------- persistence ----------
  let saveTimer = null;
  function save() { post({ t: "save", graph: state }); }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 500); }
  function uid() { return (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)); }

  // ---------- host messages ----------
  window.chrome.webview.addEventListener("message", (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.t === "init") {
      if (m.strings) S = Object.assign(S, m.strings);
      $("addLbl").textContent = S.node; $("fitLbl").textContent = S.fit || "Fit"; $("hint").textContent = S.edgeHint;
      $("exportImg").title = S.exportImage || "Export as image";
      palette = m.palette || []; folderTree = m.folderTree || [];
      state = m.graph && m.graph.nodes ? m.graph : { nodes: [], edges: [] };
      for (const n of state.nodes) { n.note = n.note || ""; n.color = n.color || ""; }
      render(); fit();
    } else if (m.t === "theme" && m.vars) {
      for (const [k, v] of Object.entries(m.vars)) document.documentElement.style.setProperty("--" + k, v);
      drawEdges();
    }
  });

  applyView();
  post({ t: "ready" });
</script>
