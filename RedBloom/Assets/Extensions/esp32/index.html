<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://redbloom.assets/vendor/codemirror/codemirror.min.css" />
<link rel="stylesheet" href="https://redbloom.assets/vendor/codemirror/theme/material-darker.min.css" />
<style>
  :root {
    --surface: #16171b; --raised: #202127; --chrome: #1b1c22; --divider: #2c2e36;
    --text: #e6e7ea; --muted: #a8abb4; --faint: #6f727b; --accent: #7a6ff0; --accent-dim: #33305a;
    --ui-font: "Segoe UI", sans-serif; --code-font: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--surface); color: var(--text); font-family: var(--ui-font); font-size: 13px;
         display: flex; flex-direction: column; overflow: hidden; }

  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--divider); }
  .bar .grow { flex: 1; }
  label.f { color: var(--faint); font-size: 11px; margin-right: 2px; }
  select, input {
    background: var(--raised); border: 1px solid var(--divider); border-radius: 6px; color: var(--text);
    font: 12.5px var(--ui-font); padding: 5px 8px;
  }
  input.mono { font-family: var(--code-font); }
  #fqbn { width: 170px; } #baud { width: 82px; } #port { min-width: 150px; } #sketch { min-width: 180px; }

  button {
    background: var(--chrome); border: 1px solid var(--divider); border-radius: 6px; color: var(--muted);
    font: 12px var(--ui-font); padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.accent { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
  button.warn:hover:not(:disabled) { border-color: #e0555f; color: #e0555f; }
  .ic { font-family: "Segoe MDL2 Assets"; font-size: 12px; margin-right: 5px; }

  #roots { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
  #roots:empty { display: none; }
  #roots .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--raised); border: 1px solid var(--divider);
                 border-radius: 20px; padding: 3px 5px 3px 10px; font-size: 11.5px; color: var(--muted); }
  #roots .chip .g { font-family: "Segoe MDL2 Assets"; font-size: 11px; color: var(--faint); }
  #roots .chip .x { cursor: pointer; color: var(--faint); border: 0; background: none; padding: 0 4px; font-size: 14px; line-height: 1; }
  #roots .chip .x:hover { color: #e0555f; }

  #hints { position: fixed; z-index: 50; min-width: 190px; max-width: 360px; max-height: 232px; overflow: auto;
           background: var(--chrome); border: 1px solid var(--divider); border-radius: 7px; box-shadow: 0 10px 28px rgba(0,0,0,.55);
           font-family: var(--code-font); font-size: 12.5px; padding: 4px; display: none; }
  #hints .h { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 5px; cursor: pointer; color: var(--text); white-space: nowrap; }
  #hints .h.sel { background: var(--accent-dim); }
  #hints .h .k { width: 16px; height: 16px; border-radius: 3px; font: 700 10px var(--ui-font); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; color: #fff; }
  #hints .k.fn { background: #4a9d5b; } #hints .k.kw { background: #b5565f; } #hints .k.co { background: #7a6ff0; }
  #hints .k.ty { background: #c8933a; } #hints .k.mb { background: #4a7fb5; } #hints .k.wd { background: #565963; color: #cfd1d6; }
  #hints .h .d { color: var(--faint); font-size: 10.5px; margin-left: auto; padding-left: 10px; }

  #mid { flex: 1; min-height: 120px; display: flex; overflow: hidden; }
  #editorWrap { flex: 1; min-width: 200px; overflow: hidden; position: relative; }
  .CodeMirror { height: 100%; font-family: var(--code-font); font-size: 13px; }

  #vsplit { width: 6px; flex: 0 0 auto; cursor: col-resize; background: var(--divider); }
  #vsplit:hover { background: var(--accent); }
  #files { width: 240px; flex: 0 0 auto; min-width: 150px; max-width: 560px; display: flex; flex-direction: column; overflow: hidden; background: var(--chrome); }
  #filesHead { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--divider);
               color: var(--faint); font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  #filesHead span { flex: 1; }
  #filesHead button { padding: 2px 6px; }
  #filesTree { flex: 1; overflow: auto; padding: 4px 0; }
  .frow { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; white-space: nowrap; color: var(--muted); font-size: 12.5px; }
  .frow:hover { background: var(--raised); }
  .frow.sel { background: var(--accent-dim); color: var(--text); }
  .frow .tw { width: 10px; flex: 0 0 auto; color: var(--faint); font-size: 9px; text-align: center; }
  .frow .fic { font-family: "Segoe MDL2 Assets"; font-size: 12px; color: var(--faint); flex: 0 0 auto; }
  .frow.sel .fic { color: var(--accent); }
  .fempty { color: var(--faint); font-size: 11.5px; padding: 12px 10px; }

  #splitter { height: 6px; flex: 0 0 auto; cursor: row-resize; background: var(--divider); }
  #splitter:hover { background: var(--accent); }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--faint);
           text-align: center; padding: 20px; pointer-events: none; }

  #actions { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--divider); }
  #status { color: var(--faint); font-size: 12px; margin-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.ok { color: #5bb85b; } #status.err { color: #e0555f; } #status.run { color: var(--accent); }

  #consoleWrap { height: 210px; display: flex; flex-direction: column; }
  #consoleHead { display: flex; align-items: center; gap: 8px; padding: 6px 14px; }
  #consoleHead .t { color: var(--faint); font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; flex: 1; }
  #console { flex: 1; overflow: auto; margin: 0; padding: 6px 14px 12px; font-family: var(--code-font); font-size: 12px;
             line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: var(--muted); }
  #console .e { color: #d99; } #console .sys { color: var(--accent); }
  #console .path { color: var(--faint); }
  .sp { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--faint); border-top-color: var(--accent);
        border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="bar">
    <label class="f" id="lPort">Port</label>
    <select id="port"><option value="">—</option></select>
    <button id="refresh" title="Refresh"><span class="ic"></span><span id="lRefresh">Refresh</span></button>
    <span class="grow"></span>
    <label class="f" id="lBoard">Board (FQBN)</label>
    <input id="fqbn" class="mono" value="esp32:esp32:esp32" spellcheck="false" />
    <label class="f">Baud</label>
    <input id="baud" class="mono" value="115200" spellcheck="false" />
  </div>

  <div class="bar">
    <label class="f" id="lSketch">Sketch</label>
    <select id="sketch"><option value="">—</option></select>
    <button id="newSketch"><span class="ic"></span><span id="lNew">New</span></button>
    <button id="openFolder"><span class="ic"></span><span id="lFolder">Folder</span></button>
    <button id="addRoot"><span class="ic"></span><span id="lAddRoot">Add folder</span></button>
    <span class="grow"></span>
    <span id="sketchPath" class="path" style="color:var(--faint);font-family:var(--code-font);font-size:11px"></span>
  </div>

  <div id="roots"></div>

  <div id="actions">
    <button id="save"><span class="ic"></span><span id="lSave">Save</span></button>
    <button id="compile" class="accent"><span class="ic"></span><span id="lCompile">Compile</span></button>
    <button id="buildBin"><span class="ic"></span><span id="lBuildBin">Build to bin</span></button>
    <button id="upload"><span class="ic"></span><span id="lUpload">Upload</span></button>
    <button id="monitor"><span class="ic"></span><span id="lMonitor">Serial monitor</span></button>
    <span id="status"></span>
  </div>

  <div id="mid">
    <div id="editorWrap">
      <textarea id="code"></textarea>
      <div id="empty" style="display:none"></div>
    </div>
    <div id="vsplit" title=""></div>
    <div id="files">
      <div id="filesHead"><span id="lFiles">Files</span><button id="filesRefresh" title="Refresh"><span class="ic" style="margin:0"></span></button></div>
      <div id="filesTree"></div>
    </div>
  </div>

  <div id="splitter" title=""></div>

  <div id="consoleWrap">
    <div id="consoleHead">
      <span class="t" id="lConsole">Output</span>
      <button id="clear" style="padding:3px 9px"><span id="lClear">Clear</span></button>
    </div>
    <div id="console"></div>
  </div>

<script src="https://redbloom.assets/vendor/codemirror/codemirror.min.js"></script>
<script src="https://redbloom.assets/vendor/codemirror/mode/clike.min.js"></script>
<script src="https://redbloom.assets/vendor/codemirror/mode/closebrackets.min.js"></script>
<script src="https://redbloom.assets/vendor/codemirror/mode/active-line.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const post = (m) => window.chrome.webview.postMessage(JSON.stringify(m));

  let dataDir = "";           // absolute path of this extension's data folder
  let sandboxSketches = "";   // dataDir + \sketches — the always-present sketch root
  let extraRoots = [];        // extra folders the user authorised (absolute)
  let sketches = [];          // { name, dir, ino, label } gathered from every root
  let cur = null;             // the open sketch, or null
  let openPath = "";          // absolute path of the file currently in the editor
  const expanded = new Set(); // folders expanded in the file browser
  let seq = 0;
  const calls = {};           // exec calls in flight
  const fsCalls = {};         // fs calls in flight
  let monitorId = null;       // running serial monitor's call id
  let busy = false;

  const baseName = (p) => { const s = p.replace(/[\\/]+$/, ""); const i = Math.max(s.lastIndexOf("\\"), s.lastIndexOf("/")); return i >= 0 ? s.slice(i + 1) : s; };
  const allRoots = () => [{ path: sandboxSketches, label: T.builtin }, ...extraRoots.map((p) => ({ path: p, label: baseName(p) }))];

  const L = {
    en: { port:"Port", refresh:"Refresh", board:"Board (FQBN)", sketch:"Sketch", nw:"New", folder:"Folder",
          addFolder:"Add folder", builtin:"Sandbox", files:"Files", filesEmpty:"Open a sketch to see its files.",
          buildBin:"Build to bin", building:"Building to bin…", built:"Built — binaries are in bin/.",
          save:"Save", compile:"Compile", upload:"Upload", monitor:"Serial monitor", stop:"Stop", console:"Output", clear:"Clear",
          empty:"Create a sketch or pick one to start writing firmware.", newName:"Sketch name:",
          noPort:"Pick a port first.", noSketch:"No sketch open.", saved:"Saved.",
          compiling:"Compiling…", compiled:"Compiled.", failed:"Failed.", uploading:"Uploading…", uploaded:"Uploaded.",
          monitoring:"Monitoring — press Stop to end.", cliMissing:"arduino-cli was not found. Install it (memory: C:\\Program Files\\Arduino CLI) or add it to PATH." },
    ru: { port:"Порт", refresh:"Обновить", board:"Плата (FQBN)", sketch:"Скетч", nw:"Новый", folder:"Папка",
          addFolder:"Добавить папку", builtin:"Песочница", files:"Файлы", filesEmpty:"Откройте скетч, чтобы увидеть файлы.",
          buildBin:"Собрать в bin", building:"Сборка в bin…", built:"Готово — бинарники в bin/.",
          save:"Сохранить", compile:"Собрать", upload:"Залить", monitor:"Монитор порта", stop:"Стоп", console:"Вывод", clear:"Очистить",
          empty:"Создайте скетч или выберите существующий, чтобы писать прошивку.", newName:"Имя скетча:",
          noPort:"Сначала выберите порт.", noSketch:"Скетч не открыт.", saved:"Сохранено.",
          compiling:"Сборка…", compiled:"Собрано.", failed:"Ошибка.", uploading:"Заливка…", uploaded:"Залито.",
          monitoring:"Монитор запущен — нажмите «Стоп», чтобы остановить.", cliMissing:"arduino-cli не найден. Установите его (заметка: C:\\Program Files\\Arduino CLI) или добавьте в PATH." },
  };
  let T = L.en;

  const TEMPLATE =
    "void setup() {\n" +
    "  Serial.begin(115200);\n" +
    "  pinMode(LED_BUILTIN, OUTPUT);\n" +
    "}\n\n" +
    "void loop() {\n" +
    "  digitalWrite(LED_BUILTIN, HIGH);\n" +
    "  delay(500);\n" +
    "  digitalWrite(LED_BUILTIN, LOW);\n" +
    "  delay(500);\n" +
    "}\n";

  const cm = CodeMirror.fromTextArea($("code"), {
    mode: "text/x-c++src", lineNumbers: true, theme: "material-darker",
    autoCloseBrackets: true, styleActiveLine: true, indentUnit: 2, tabSize: 2,
  });
  cm.setSize("100%", "100%");

  // ---------- code hints (lightweight IntelliSense) ----------
  const mb = (a) => a.map((x) => ({ text: x, kind: "mb" }));
  const KIND = { fn: "ƒ", kw: "K", co: "C", ty: "T", mb: "M", wd: "a" };
  const SERIAL = ["begin", "end", "available", "availableForWrite", "read", "peek", "write", "print", "println",
    "printf", "flush", "setTimeout", "readString", "readStringUntil", "readBytes", "parseInt", "parseFloat"];
  const MEMBERS = {
    Serial: mb(SERIAL), Serial1: mb(SERIAL), Serial2: mb(SERIAL),
    ESP: mb(["getFreeHeap", "getHeapSize", "getMinFreeHeap", "getChipModel", "getChipRevision", "getCpuFreqMHz",
      "getFlashChipSize", "getSdkVersion", "getEfuseMac", "restart"]),
    Wire: mb(["begin", "end", "beginTransmission", "endTransmission", "requestFrom", "write", "available", "read", "setClock", "onReceive", "onRequest"]),
    SPI: mb(["begin", "end", "beginTransaction", "endTransaction", "transfer", "transfer16", "setFrequency", "setBitOrder", "setDataMode"]),
    WiFi: mb(["begin", "disconnect", "status", "localIP", "macAddress", "SSID", "RSSI", "mode", "softAP", "scanNetworks"]),
    String: mb(["length", "charAt", "indexOf", "substring", "toInt", "toFloat", "toUpperCase", "toLowerCase", "trim", "equals", "startsWith", "endsWith", "c_str"]),
  };
  const KW = ["void", "int", "long", "short", "char", "bool", "boolean", "byte", "float", "double", "unsigned", "signed",
    "const", "static", "volatile", "struct", "class", "enum", "typedef", "sizeof", "return", "if", "else", "for", "while",
    "do", "switch", "case", "default", "break", "continue", "true", "false", "new", "delete", "include", "define"];
  const TY = ["uint8_t", "uint16_t", "uint32_t", "uint64_t", "int8_t", "int16_t", "int32_t", "int64_t", "size_t", "String", "IPAddress"];
  const CO = ["HIGH", "LOW", "INPUT", "OUTPUT", "INPUT_PULLUP", "INPUT_PULLDOWN", "LED_BUILTIN", "CHANGE", "RISING", "FALLING",
    "PI", "TWO_PI", "HALF_PI", "DEG_TO_RAD", "RAD_TO_DEG", "DEC", "HEX", "OCT", "BIN", "A0"];
  const FN = ["setup", "loop", "pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite", "analogReadResolution",
    "analogWriteResolution", "analogSetAttenuation", "delay", "delayMicroseconds", "millis", "micros", "map", "constrain",
    "min", "max", "abs", "pow", "sqrt", "sin", "cos", "tan", "random", "randomSeed", "tone", "noTone", "pulseIn", "shiftOut",
    "shiftIn", "attachInterrupt", "detachInterrupt", "digitalPinToInterrupt", "bitRead", "bitWrite", "bitSet", "bitClear",
    "ledcSetup", "ledcAttachPin", "ledcWrite", "ledcRead", "ledcReadFreq", "ledcWriteTone", "dacWrite", "touchRead",
    "touchAttachInterrupt", "temperatureRead", "esp_restart"];
  const OBJ = ["Serial", "Serial1", "Serial2", "Wire", "SPI", "ESP", "WiFi"];
  const GLOBALS = [].concat(
    FN.map((x) => ({ text: x, kind: "fn" })), KW.map((x) => ({ text: x, kind: "kw" })),
    TY.map((x) => ({ text: x, kind: "ty" })), CO.map((x) => ({ text: x, kind: "co" })),
    OBJ.map((x) => ({ text: x, kind: "ty" })));

  let popup = null, items = [], sel = 0, lastCtx = null, popupOpen = false, hintTimer = null;

  function docWords() { const set = new Set(); const re = /[A-Za-z_$][\w$]*/g; const txt = cm.getValue(); let m; while ((m = re.exec(txt))) if (m[0].length > 2) set.add(m[0]); return [...set]; }
  function ctxAt() {
    const c = cm.getCursor(), line = cm.getLine(c.line).slice(0, c.ch);
    const mem = line.match(/([A-Za-z_$][\w$]*)\s*(?:\.|->)\s*([\w$]*)$/);
    if (mem) return { member: mem[1], prefix: mem[2], from: { line: c.line, ch: c.ch - mem[2].length } };
    const w = line.match(/([A-Za-z_$][\w$]*)$/);
    if (w) return { prefix: w[1], from: { line: c.line, ch: c.ch - w[1].length } };
    return null;
  }
  function candidates(ctx) {
    const pfx = ctx.prefix.toLowerCase();
    let pool = ctx.member ? (MEMBERS[ctx.member] || []) : GLOBALS;
    if (ctx.member && !pool.length) pool = docWords().map((w) => ({ text: w, kind: "wd" }));
    if (!ctx.member) pool = pool.concat(docWords().map((w) => ({ text: w, kind: "wd" })));
    const seen = new Set(), out = [];
    for (const c of pool) {
      const lt = c.text.toLowerCase();
      if (!seen.has(lt) && lt.startsWith(pfx) && lt !== pfx) { seen.add(lt); out.push(c); }
    }
    out.sort((a, b) => a.text.length - b.text.length || a.text.localeCompare(b.text));
    return out.slice(0, 40);
  }
  function ensurePopup() { if (!popup) { popup = document.createElement("div"); popup.id = "hints"; document.body.appendChild(popup); } return popup; }
  function hidePopup() { const was = popupOpen; popupOpen = false; if (popup) popup.style.display = "none"; return was; }
  function render() {
    const el = ensurePopup(); el.innerHTML = "";
    items.forEach((c, i) => {
      const d = document.createElement("div"); d.className = "h" + (i === sel ? " sel" : "");
      const k = document.createElement("span"); k.className = "k " + c.kind; k.textContent = KIND[c.kind] || "·"; d.appendChild(k);
      const t = document.createElement("span"); t.textContent = c.text; d.appendChild(t);
      if (c.kind === "fn") { const s = document.createElement("span"); s.className = "d"; s.textContent = "()"; d.appendChild(s); }
      d.onmousedown = (e) => { e.preventDefault(); sel = i; accept(); };
      el.appendChild(d);
    });
    const co = cm.cursorCoords(true, "window");
    el.style.display = "block";
    el.style.left = Math.min(co.left, window.innerWidth - 370) + "px";
    const below = window.innerHeight - co.bottom;
    el.style.top = (below > 244 ? co.bottom + 2 : Math.max(4, co.top - Math.min(232, el.scrollHeight) - 2)) + "px";
    popupOpen = true;
  }
  function showHints(force) {
    const ctx = ctxAt();
    if (!ctx) { hidePopup(); return !!force; }
    if (!ctx.member && !force && ctx.prefix.length < 2) { hidePopup(); return !!force; }
    const list = candidates(ctx);
    if (!list.length) { hidePopup(); return !!force; }
    lastCtx = ctx; items = list; sel = 0; render(); return true;
  }
  function nav(dir) { if (!popupOpen) return false; sel = (sel + dir + items.length) % items.length; render(); const row = popup.children[sel]; if (row) row.scrollIntoView({ block: "nearest" }); return true; }
  function accept() {
    if (!popupOpen) return false;
    const c = items[sel];
    if (c) cm.replaceRange(c.text, lastCtx.from, cm.getCursor());
    hidePopup();
    return true;
  }

  cm.setOption("extraKeys", {
    "Ctrl-Space": () => { showHints(true); },
    "Down": () => nav(1) ? undefined : CodeMirror.Pass,
    "Up": () => nav(-1) ? undefined : CodeMirror.Pass,
    "Enter": () => accept() ? undefined : CodeMirror.Pass,
    "Tab": () => accept() ? undefined : CodeMirror.Pass,
    "Esc": () => hidePopup() ? undefined : CodeMirror.Pass,
  });
  cm.on("inputRead", (_, ch) => {
    const last = ch.text.join("").slice(-1);
    if (/[\w.]/.test(last)) { clearTimeout(hintTimer); hintTimer = setTimeout(() => showHints(false), 90); }
    else hidePopup();
  });
  cm.on("blur", hidePopup);
  cm.on("scroll", hidePopup);

  // ---------- host bridge ----------
  function run(program, args, opts) {
    opts = opts || {};
    const id = "c" + (++seq);
    const done = new Promise((resolve) => { calls[id] = { out: [], err: [], onLine: opts.onLine, quiet: !!opts.quiet, resolve }; });
    post({ t: "exec", id, program, args, cwd: opts.cwd || "" });
    return { id, done };
  }
  function fs(t, path, extra) {
    const id = "f" + (++seq);
    const p = new Promise((resolve) => { fsCalls[id] = resolve; });
    post(Object.assign({ t, id, path }, extra || {}));
    return p;
  }

  window.chrome.webview.addEventListener("message", (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    switch (m.t) {
      case "init":
        dataDir = m.dataDir || "";
        sandboxSketches = dataDir + "\\sketches";
        extraRoots = m.roots || [];
        T = m.lang === "ru" ? L.ru : L.en;
        applyLang();
        renderRoots();
        boot();
        break;
      case "roots":
        onRoots(m.roots);
        break;
      case "fsChanged":
        onFsChanged();
        break;
      case "theme":
        if (m.vars) for (const [k, v] of Object.entries(m.vars)) document.documentElement.style.setProperty("--" + k, v);
        break;
      case "exec.out": {
        const c = calls[m.id]; if (!c) break;
        (m.stream === "stderr" ? c.err : c.out).push(m.text);
        if (!c.quiet) writeLine(m.text, m.stream === "stderr");
        if (c.onLine) c.onLine(m.text, m.stream);
        break;
      }
      case "exec.done": {
        const c = calls[m.id]; if (!c) break; delete calls[m.id];
        c.resolve({ code: m.code, out: c.out.join("\n"), err: c.err.join("\n"), error: m.error });
        break;
      }
      case "fs.list.result": { const r = fsCalls[m.id]; if (r) { delete fsCalls[m.id]; r(m.entries || []); } break; }
      case "fs.read.result": { const r = fsCalls[m.id]; if (r) { delete fsCalls[m.id]; r(m); } break; }
      case "fs.write.result":
      case "fs.mkdir.result": { const r = fsCalls[m.id]; if (r) { delete fsCalls[m.id]; r(m); } break; }
    }
  });

  // ---------- console ----------
  function writeLine(text, isErr) {
    const el = document.createElement("div");
    if (isErr) el.className = "e";
    el.textContent = text;
    $("console").appendChild(el);
    $("console").scrollTop = $("console").scrollHeight;
  }
  function writeSys(text) { const el = document.createElement("div"); el.className = "sys"; el.textContent = text; $("console").appendChild(el); $("console").scrollTop = $("console").scrollHeight; }
  function setStatus(text, cls) { const s = $("status"); s.className = cls || ""; s.innerHTML = (cls === "run" ? '<span class="sp"></span>' : "") + text; }

  // ---------- sketches (gathered from the sandbox + every authorised folder) ----------
  async function refreshSketches(selectDir) {
    sketches = [];
    const rootsList = allRoots();
    const multi = rootsList.length > 1;
    for (const r of rootsList) {
      const entries = await fs("fs.list", r.path);
      for (const e of entries) {
        if (!e.dir) continue;
        const dir = r.path + "\\" + e.name;
        sketches.push({ name: e.name, dir, ino: dir + "\\" + e.name + ".ino", label: (multi ? r.label + " / " : "") + e.name });
      }
    }
    const sel = $("sketch");
    sel.innerHTML = sketches.length ? "" : '<option value="">—</option>';
    sketches.forEach((s, i) => { const o = document.createElement("option"); o.value = String(i); o.textContent = s.label; sel.appendChild(o); });
    const idx = selectDir != null ? sketches.findIndex((s) => s.dir === selectDir) : -1;
    if (idx >= 0) sel.value = String(idx);
    post({ t: "watch", paths: allRoots().map((r) => r.path) });   // keep the list live as files change
    return idx;
  }

  let fsTimer = null;
  function onFsChanged() { clearTimeout(fsTimer); fsTimer = setTimeout(() => { refreshSketches(cur ? cur.dir : null); renderFiles(); }, 350); }

  async function openSketch(idx) {
    if (idx == null || idx < 0 || !sketches[idx]) { cur = null; openPath = ""; cm.setValue(""); $("empty").style.display = "flex"; $("sketchPath").textContent = ""; renderFiles(); return; }
    cur = sketches[idx];
    $("sketch").value = String(idx);
    expanded.clear(); expanded.add(cur.dir);
    await loadFile(cur.ino, true);          // the sketch's own .ino; template if it is missing
  }

  const modeFor = (p) => /^(ino|pde|cpp|cc|cxx|c|h|hpp|hh)$/.test((p.split(".").pop() || "").toLowerCase()) ? "text/x-c++src" : "text/plain";

  const isBinary = (p) => /\.(bin|elf|hex|map|o|a|obj|lib|png|jpg|jpeg|gif|ico|zip|gz|exe|dll)$/i.test(p);

  async function loadFile(path, fallback) {
    if (!fallback && isBinary(path)) return;   // don't dump a binary into the text editor
    const r = await fs("fs.read", path);
    if (!(r && r.ok) && !fallback) { setStatus(T.failed, "err"); return; }
    openPath = path;
    cm.setValue(r && r.ok ? r.text : TEMPLATE);
    cm.clearHistory();
    cm.setOption("mode", modeFor(path));
    $("empty").style.display = "none";
    $("sketchPath").textContent = path;
    renderFiles();
  }

  async function saveCurrent() {
    if (!openPath) { setStatus(T.noSketch, "err"); return false; }
    const r = await fs("fs.write", openPath, { text: cm.getValue() });
    return !!(r && r.ok);
  }

  // ---------- file browser (right side, like a solution explorer) ----------
  async function renderFiles() {
    const el = $("filesTree");
    if (!cur) { el.innerHTML = '<div class="fempty">' + T.filesEmpty + "</div>"; return; }
    el.innerHTML = "";
    expanded.add(cur.dir);
    await renderInto(el, cur.dir, 0);
  }
  async function renderInto(container, dir, depth) {
    const entries = await fs("fs.list", dir);
    for (const e of entries) {
      const path = dir + "\\" + e.name;
      const row = document.createElement("div");
      row.className = "frow" + (path === openPath ? " sel" : "");
      row.style.paddingLeft = (8 + depth * 12) + "px";
      const tw = document.createElement("span"); tw.className = "tw"; tw.textContent = e.dir ? (expanded.has(path) ? "▾" : "▸") : "";
      const ic = document.createElement("span"); ic.className = "fic"; ic.textContent = e.dir ? "\uE8B7" : "\uE8A5";
      const nm = document.createElement("span"); nm.textContent = e.name;
      row.appendChild(tw); row.appendChild(ic); row.appendChild(nm);
      if (e.dir) row.onclick = () => { expanded.has(path) ? expanded.delete(path) : expanded.add(path); renderFiles(); };
      else row.onclick = () => loadFile(path);
      container.appendChild(row);
      if (e.dir && expanded.has(path)) await renderInto(container, path, depth + 1);
    }
  }

  function renderRoots() {
    const el = $("roots");
    el.innerHTML = "";
    for (const p of extraRoots) {
      const chip = document.createElement("span"); chip.className = "chip"; chip.title = p;
      const g = document.createElement("span"); g.className = "g"; g.textContent = ""; chip.appendChild(g);
      const nm = document.createElement("span"); nm.textContent = baseName(p); chip.appendChild(nm);
      const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = p;
      x.onclick = () => post({ t: "removeRoot", path: p }); chip.appendChild(x);
      el.appendChild(chip);
    }
  }

  // A folder was added or removed by the host — it is the source of truth for what is allowed.
  function onRoots(list) {
    extraRoots = list || [];
    renderRoots();
    refreshSketches(cur ? cur.dir : null).then((idx) => { if (idx < 0 && !cur) openSketch(-1); });
  }

  // ---------- board ports ----------
  let cliOk = true;           // false once arduino-cli is known missing, to stop auto-polling
  async function refreshPorts(auto) {
    if (!auto) setStatus("", "");
    const { done } = run("arduino-cli", ["board", "list", "--format", "json"], { quiet: true });
    const r = await done;
    if (r.error) { cliOk = false; if (!auto) { setStatus(T.cliMissing, "err"); writeSys(T.cliMissing); } return; }
    cliOk = true;
    let ports = [];
    try {
      const j = JSON.parse(r.out || "[]");
      const list = Array.isArray(j) ? j : (j.detected_ports || j.ports || []);
      for (const item of list) {
        const p = item.port || item;
        if (p && p.address && (!p.protocol || p.protocol === "serial")) {
          const boards = item.matching_boards || item.boards || [];
          ports.push({ address: p.address, label: p.address + (boards[0] ? " · " + boards[0].name : ""), fqbn: boards[0] && boards[0].fqbn });
        }
      }
    } catch { /* leave ports empty */ }
    const sel = $("port"), keep = sel.value;
    sel.innerHTML = ports.length ? "" : '<option value="">—</option>';
    for (const p of ports) { const o = document.createElement("option"); o.value = p.address; o.textContent = p.label; sel.appendChild(o); if (p.fqbn) $("fqbn").value = p.fqbn; }
    if (ports.some((p) => p.address === keep)) sel.value = keep;
  }

  // ---------- actions ----------
  function setBusy(on) { busy = on; for (const id of ["compile", "buildBin", "upload", "save", "newSketch", "refresh"]) $(id).disabled = on; }

  // Compile and drop the firmware binaries (.bin/.elf/.map) into a bin/ folder beside the sketch.
  async function buildBin() {
    if (busy || !cur) { if (!cur) setStatus(T.noSketch, "err"); return; }
    if (!(await saveCurrent())) { setStatus(T.failed, "err"); return; }
    const out = cur.dir + "\\bin";
    setBusy(true); setStatus(T.building, "run"); writeSys("$ arduino-cli compile --fqbn " + $("fqbn").value + " --output-dir bin " + cur.name);
    const { done } = run("arduino-cli", ["compile", "--fqbn", $("fqbn").value.trim(), "--output-dir", out, cur.dir], { cwd: cur.dir });
    const r = await done;
    setBusy(false);
    if (r.code === 0) { setStatus(T.built, "ok"); expanded.add(out); renderFiles(); } else setStatus(T.failed, "err");
  }

  async function compile() {
    if (busy || !cur) { if (!cur) setStatus(T.noSketch, "err"); return; }
    if (!(await saveCurrent())) { setStatus(T.failed, "err"); return; }
    setBusy(true); setStatus(T.compiling, "run"); writeSys("$ arduino-cli compile --fqbn " + $("fqbn").value + " " + cur.name);
    const { done } = run("arduino-cli", ["compile", "--fqbn", $("fqbn").value.trim(), cur.dir], { cwd: cur.dir });
    const r = await done;
    setBusy(false);
    setStatus(r.code === 0 ? T.compiled : T.failed, r.code === 0 ? "ok" : "err");
  }

  async function upload() {
    const port = $("port").value;
    if (busy || !cur) { if (!cur) setStatus(T.noSketch, "err"); return; }
    if (!port) { setStatus(T.noPort, "err"); return; }
    if (!(await saveCurrent())) { setStatus(T.failed, "err"); return; }
    setBusy(true); setStatus(T.uploading, "run"); writeSys("$ arduino-cli upload -p " + port + " --fqbn " + $("fqbn").value + " " + cur.name);
    const { done } = run("arduino-cli", ["upload", "-p", port, "--fqbn", $("fqbn").value.trim(), cur.dir], { cwd: cur.dir });
    const r = await done;
    setBusy(false);
    setStatus(r.code === 0 ? T.uploaded : T.failed, r.code === 0 ? "ok" : "err");
  }

  function toggleMonitor() {
    if (monitorId) { post({ t: "exec.cancel", id: monitorId }); monitorId = null; updateMonitorBtn(); setStatus("", ""); return; }
    const port = $("port").value;
    if (!port) { setStatus(T.noPort, "err"); return; }
    writeSys("$ arduino-cli monitor -p " + port + " -c baudrate=" + $("baud").value);
    const { id, done } = run("arduino-cli", ["monitor", "-p", port, "-c", "baudrate=" + $("baud").value.trim()]);
    monitorId = id; updateMonitorBtn(); setStatus(T.monitoring, "run");
    done.then(() => { const wasRunning = monitorId === id; monitorId = null; updateMonitorBtn(); if (wasRunning && !busy) setStatus("", ""); });
  }
  function updateMonitorBtn() {
    const b = $("monitor");
    b.classList.toggle("warn", !!monitorId);
    b.querySelector("span:last-child").textContent = monitorId ? T.stop : T.monitor;
    b.querySelector(".ic").textContent = monitorId ? "" : "";
  }

  // ---------- wire up ----------
  $("refresh").onclick = () => refreshPorts(false);
  $("openFolder").onclick = () => post({ t: "openFolder", path: cur ? cur.dir : sandboxSketches });
  $("addRoot").onclick = () => post({ t: "pickFolder" });
  $("sketch").onchange = () => openSketch(parseInt($("sketch").value, 10));
  $("save").onclick = async () => { if (await saveCurrent()) setStatus(T.saved, "ok"); };
  $("compile").onclick = compile;
  $("buildBin").onclick = buildBin;
  $("upload").onclick = upload;
  $("monitor").onclick = toggleMonitor;
  $("clear").onclick = () => { $("console").innerHTML = ""; };
  $("filesRefresh").onclick = () => renderFiles();

  // draggable splitters: output height and file-browser width
  function drag(handle, onMove) {
    handle.addEventListener("pointerdown", (e) => {
      e.preventDefault(); handle.setPointerCapture(e.pointerId);
      const mv = (ev) => onMove(ev);
      const up = () => { try { handle.releasePointerCapture(e.pointerId); } catch {} handle.removeEventListener("pointermove", mv); handle.removeEventListener("pointerup", up); };
      handle.addEventListener("pointermove", mv); handle.addEventListener("pointerup", up);
    });
  }
  drag($("splitter"), (ev) => { $("consoleWrap").style.height = Math.min(window.innerHeight - 220, Math.max(90, window.innerHeight - ev.clientY)) + "px"; cm.refresh(); });
  drag($("vsplit"), (ev) => { $("files").style.width = Math.min(560, Math.max(150, window.innerWidth - ev.clientX)) + "px"; cm.refresh(); });
  $("newSketch").onclick = async () => {
    const raw = window.prompt(T.newName, "sketch_" + new Date().toISOString().slice(0, 10).replace(/-/g, ""));
    if (!raw) return;
    const name = raw.trim().replace(/[^A-Za-z0-9_]/g, "_");
    if (!name) return;
    // New sketches always go into the sandbox, the one root we know is writable.
    const dir = sandboxSketches + "\\" + name;
    await fs("fs.write", dir + "\\" + name + ".ino", { text: TEMPLATE.replace("115200", $("baud").value.trim() || "115200") });
    const idx = await refreshSketches(dir);
    await openSketch(idx);
    setStatus(T.saved, "ok");
  };

  cm.on("keydown", (_, e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); $("save").click(); } });

  function applyLang() {
    $("lPort").textContent = T.port; $("lRefresh").textContent = T.refresh; $("lBoard").textContent = T.board;
    $("lSketch").textContent = T.sketch; $("lNew").textContent = T.nw; $("lFolder").textContent = T.folder;
    $("lAddRoot").textContent = T.addFolder; $("lBuildBin").textContent = T.buildBin; $("lFiles").textContent = T.files;
    $("lSave").textContent = T.save; $("lCompile").textContent = T.compile; $("lUpload").textContent = T.upload;
    $("lConsole").textContent = T.console; $("lClear").textContent = T.clear; $("empty").textContent = T.empty;
    updateMonitorBtn();
  }

  async function boot() {
    await fs("fs.mkdir", "sketches");
    await refreshSketches();
    if (sketches.length) await openSketch(0); else { $("empty").style.display = "flex"; renderFiles(); }
    refreshPorts();
  }

  // Keep the port list fresh — plug or unplug a board and it appears/disappears on its own.
  setInterval(() => { if (cliOk && !busy && !monitorId && !document.hidden) refreshPorts(true); }, 6000);

  post({ t: "ready" });
</script>
</body>
</html>
