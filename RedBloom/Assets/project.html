<meta charset="utf-8" />
<style>
  :root {
    --surface: #17181c; --surface2: #131418; --raised: #1e2026; --chrome: #24262e;
    --divider: #33353d; --text: #e8e8ea; --muted: #a9abb3; --faint: #71737b;
    --accent: #e0555f; --accent-dim: #8c2b33; --ui-font: "Segoe UI"; --code-font: Consolas;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  /* Transparent, so the app's wallpaper shows through the page; the graph and info panels below
     keep a solid background of their own so they stay readable. */
  body { background: transparent; color: var(--text); font-family: var(--ui-font);
         overflow-y: auto; overflow-x: hidden; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 26px 30px 60px; }

  h2.sec { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; color: var(--faint);
           text-transform: uppercase; margin: 26px 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .pill { border: 1px solid var(--divider); background: transparent; color: var(--muted);
          border-radius: 6px; padding: 5px 11px; font: inherit; font-size: 11.5px; cursor: pointer; }
  .pill:hover { color: var(--text); border-color: var(--accent); }
  .ic { font-family: "Segoe MDL2 Assets"; }

  /* header */
  #name { background: none; border: 0; color: var(--text); font: 600 21px var(--ui-font);
          width: 100%; padding: 0; outline: none; }
  #desc { background: none; border: 0; color: var(--muted); font: 12.5px var(--ui-font);
          width: 100%; padding: 0; margin-top: 5px; resize: none; outline: none; overflow: hidden; }
  #folder { background: var(--surface2); border: 1px solid var(--divider); border-radius: 8px;
            padding: 7px 12px; margin-top: 12px; }
  #folder .path { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* stats */
  #stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .tile { background: var(--surface2); border: 1px solid var(--divider); border-radius: 8px;
          padding: 9px 15px 9px 13px; min-width: 92px; }
  .tile .v { font-size: 18px; font-weight: 600; }
  .tile .l { font-size: 10.5px; color: var(--faint); margin-top: 2px; }

  /* code-by-language chart */
  #chart { margin-top: 10px; }
  #chart .bar { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 11px; }
  #chart .bar .nm { width: 92px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chart .bar .track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  #chart .bar .fill { height: 100%; border-radius: 4px; }
  #chart .bar .n { width: 58px; text-align: right; color: var(--faint); }

  /* sources */
  #sources .src { display: flex; align-items: center; gap: 9px; padding: 6px 4px; }
  #sources .src .g { color: var(--faint); font-family: "Segoe MDL2 Assets"; font-size: 13px; }
  #sources .src .nm { font-size: 12.5px; }
  #sources .src .sub { font-size: 10.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sources .src .badge { font-size: 10.5px; color: var(--muted); margin: 0 6px; white-space: nowrap; }
  #sources .src .act { color: var(--faint); background: none; border: 0; cursor: pointer; font-family: "Segoe MDL2 Assets"; font-size: 12px; padding: 4px; }
  #sources .src .act:hover { color: var(--text); }
  #sources .empty { color: var(--faint); font-size: 12px; padding: 3px 4px; }
  #pubprogress { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; padding: 8px 11px; border: 1px solid var(--divider);
                 border-radius: 8px; background: var(--raised); color: var(--muted); font-size: 12px; }
  #pubprogress.ok { color: #5bb85b; border-color: #33301f; } #pubprogress.err { color: #e0555f; }
  #pubprogress #pubtext { font-family: var(--code-font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .psp { width: 12px; height: 12px; flex: 0 0 auto; border: 2px solid var(--faint); border-top-color: var(--accent);
         border-radius: 50%; animation: pspin .7s linear infinite; }
  #pubprogress.ok .psp, #pubprogress.err .psp { display: none; }
  @keyframes pspin { to { transform: rotate(360deg); } }

  /* graph */
  #graph { position: relative; height: 66vh; min-height: 420px; margin-top: 8px;
           border: 1px solid var(--divider); border-radius: 10px; overflow: hidden; background: var(--surface2); }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #edges .hit { stroke: transparent; stroke-width: 16; fill: none; cursor: pointer; pointer-events: stroke; }
  #edges line, #edges text { pointer-events: stroke; }
  #edges text { fill: var(--muted); font: 11px var(--ui-font); paint-order: stroke; stroke: var(--surface2); stroke-width: 3px; cursor: pointer; }
  .node { position: absolute; width: 176px; min-height: 40px; background: var(--raised);
          border: 1px solid var(--divider); border-left: 3px solid var(--accent); border-radius: 9px;
          padding: 9px 11px; cursor: grab; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 18px rgba(0,0,0,.45); }
  .node .top { display: flex; align-items: center; gap: 7px; }
  .node .nic { font-family: "Segoe MDL2 Assets"; font-size: 13px; color: var(--faint); }
  .node .lbl { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .kind { margin-top: 3px; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .node .port { position: absolute; right: -8px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px;
                border-radius: 50%; background: var(--accent); border: 2px solid var(--surface2); cursor: crosshair; opacity: 0; transition: opacity .12s; }
  .node:hover .port, .node.sel .port { opacity: 1; }
  #bar { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; z-index: 6; }
  #bar button { background: var(--chrome); color: var(--muted); border: 1px solid var(--divider);
                border-radius: 7px; padding: 6px 10px; font: 12px var(--ui-font); cursor: pointer; }
  #bar button:hover { color: var(--text); border-color: var(--accent); }
  #ghint { position: absolute; left: 12px; bottom: 10px; color: var(--faint); font-size: 11px; z-index: 6; pointer-events: none; }
  #menu { position: absolute; z-index: 12; min-width: 190px; max-height: 60%; overflow: auto; background: var(--chrome);
          border: 1px solid var(--divider); border-radius: 9px; padding: 5px; box-shadow: 0 12px 30px rgba(0,0,0,.5); display: none; }
  #menu .mi { padding: 7px 10px; border-radius: 6px; font-size: 12.5px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #menu .mi:hover { background: var(--raised); }
  #menu .mi .nic { font-family: "Segoe MDL2 Assets"; font-size: 12px; color: var(--faint); }
  #menu .mi .exp { display: inline-block; width: 12px; text-align: center; color: var(--faint); font-size: 9px; }
  #menu .mi .exp:hover { color: var(--text); }
  #menu .mi.ftree { padding-top: 5px; padding-bottom: 5px; gap: 5px; }
  #menu .grp { padding: 8px 10px 3px; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
  #insp { position: absolute; right: 0; top: 0; bottom: 0; width: 258px; z-index: 10; background: var(--surface);
          border-left: 1px solid var(--divider); padding: 15px; overflow: auto; transform: translateX(100%); transition: transform .16s ease; }
  #insp.on { transform: none; }
  #insp h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }
  #insp label { display: block; font-size: 11px; color: var(--muted); margin: 12px 0 4px; }
  #insp input[type=text], #insp textarea, #insp select { width: 100%; background: var(--raised); border: 1px solid var(--divider);
          border-radius: 6px; color: var(--text); font: 12.5px var(--ui-font); padding: 6px 8px; }
  #insp textarea { min-height: 56px; resize: vertical; }
  #insp .sw { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  #insp .sw span { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  #insp .sw span.on { border-color: var(--text); }
  #insp .sw span.clear { background: var(--raised); border: 1px dashed var(--faint); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--faint); }
  #insp .sw span.add { position: relative; overflow: hidden; background: var(--raised); border: 1px dashed var(--faint); display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1; color: var(--faint); }
  #insp .sw span.add:hover { border-color: var(--accent); color: var(--text); }
  #insp .sw span.cust { position: relative; overflow: visible; }
  #insp .sw span.cust .del { position: absolute; top: -5px; right: -5px; width: 13px; height: 13px; border-radius: 50%;
          background: var(--chrome); color: var(--text); border: 1px solid var(--divider); font: normal 10px/11px var(--ui-font);
          text-align: center; display: none; cursor: pointer; }
  #insp .sw span.cust:hover .del { display: block; }
  #insp .sw span.cust .del:hover { border-color: #ff6b74; color: #ff6b74; }
  #insp .chk { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12.5px; cursor: pointer; }
  #insp .acts { display: flex; gap: 8px; margin-top: 16px; }
  #insp .acts button { flex: 1; padding: 7px; border-radius: 6px; font: 12px var(--ui-font); cursor: pointer; }
  #insp .open { background: var(--accent-dim); color: var(--text); border: 1px solid var(--accent); }
  #insp .del { background: transparent; color: var(--muted); border: 1px solid var(--divider); }
  #insp .del:hover { color: #ff6b74; border-color: #ff6b74; }

  /* info / markdown */
  #infobox { position: relative; margin-top: 8px; border: 1px solid var(--divider); border-radius: 10px;
             background: var(--surface2); min-height: 180px; padding: 4px 4px; }
  #mdview { padding: 10px 16px 14px; }
  #mdview:empty { display: none; }
  #mdempty { padding: 22px 16px; color: var(--faint); font-size: 12px; text-align: center; }
  #mdview h1 { font-size: 20px; } #mdview h2 { font-size: 16px; } #mdview h3 { font-size: 14px; }
  #mdview code { background: var(--chrome); border-radius: 3px; padding: 1px 4px; font-family: var(--code-font); }
  #mdview pre { background: var(--chrome); padding: 10px; border-radius: 6px; overflow: auto; }
  #mdview a { color: var(--accent); }
</style>

<div class="wrap">
  <input id="name" spellcheck="false" />
  <textarea id="desc" rows="1" spellcheck="false"></textarea>

  <div id="folder" class="row">
    <span class="ic" style="color:var(--faint);font-size:13px">&#xE8B7;</span>
    <span class="path grow" id="folderPath"></span>
    <button class="pill" id="openFolder"></button>
  </div>

  <div id="stats"></div>
  <div id="chart"></div>

  <div class="row"><h2 class="sec grow" id="secSources"></h2>
    <button class="pill" id="publish" style="margin-right:6px"><span class="ic">&#xE898;</span> <span id="publishLbl"></span></button>
    <button class="pill" id="addSource">+ <span id="addSourceLbl"></span></button></div>
  <div id="pubprogress" style="display:none"><span class="psp"></span><span id="pubtext"></span></div>
  <div id="sources"></div>

  <div class="row"><h2 class="sec grow" id="secGraph"></h2><button class="pill" id="expandGraph"></button></div>
  <div id="graph">
    <div id="world"><svg id="edges"></svg></div>
    <div id="bar"><button id="addNode">+ <span id="addNodeLbl"></span></button>
      <button id="zin">+</button><button id="zout">&#8722;</button><button id="fit"></button>
      <button id="exportImg" style="font-family:'Segoe MDL2 Assets';font-size:12px">&#xE8B9;</button></div>
    <div id="ghint"></div>
    <div id="menu"></div>
    <div id="insp"></div>
  </div>

  <div class="row"><h2 class="sec grow" id="secInfo"></h2>
    <button class="pill" id="expandInfo"><span class="ic">&#xE740;</span> <span id="expandInfoLbl"></span></button></div>
  <div id="infobox">
    <div id="mdview"></div>
    <div id="mdempty"></div>
  </div>
</div>

<script>
  const SVGNS = "http://www.w3.org/2000/svg";
  const post = (m) => window.chrome.webview.postMessage(JSON.stringify(m));
  const $ = (id) => document.getElementById(id);
  const graphEl = $("graph"), world = $("world"), svg = $("edges"), menu = $("menu"), insp = $("insp");

  let S = {};
  const g = (c) => String.fromCharCode(c);
  const KG = { note: g(0xE70B), chat: g(0xE8BD), room: g(0xE716), file: g(0xE8A5), source: g(0xE8B7), folder: g(0xE8B7), milestone: g(0xE7C1) };
  const SRCG = { Local: g(0xE8B7), VisualStudio: g(0xE943), GitHub: g(0xE71B) };
  const PALETTE = ["", "#e0555f", "#e0913f", "#d8c14a", "#5bb85b", "#4aa6d8", "#7a6ff0", "#c46fd0"];

  let state = { nodes: [], edges: [] };
  let palette = [];
  let folderTree = [];
  let view = { x: 50, y: 50, z: 1 };
  let sel = null;
  const nodeEls = new Map();

  // ---------- header ----------
  const nameEl = $("name"), descEl = $("desc");
  nameEl.addEventListener("input", () => post({ t: "name", value: nameEl.value }));
  function fitDesc() { descEl.style.height = "auto"; descEl.style.height = descEl.scrollHeight + "px"; }
  descEl.addEventListener("input", () => { fitDesc(); post({ t: "desc", value: descEl.value }); });
  $("openFolder").onclick = () => post({ t: "openFolder" });
  $("addSource").onclick = () => post({ t: "addSource" });
  $("publish").onclick = () => post({ t: "publish" });
  $("expandGraph").onclick = () => post({ t: "expandGraph" });

  // ---------- stats ----------
  function renderStats(st) {
    const box = $("stats"); box.innerHTML = "";
    if (!st) return;
    const tile = (v, l, tip) => { const d = document.createElement("div"); d.className = "tile"; if (tip) d.title = tip;
      d.innerHTML = `<div class="v"></div><div class="l"></div>`; d.querySelector(".v").textContent = v; d.querySelector(".l").textContent = l; return d; };
    box.appendChild(tile(st.chats, (S.statChats || "chats") + " · " + st.chatMessages));
    box.appendChild(tile(st.rooms, (S.statRooms || "rooms") + " · " + st.roomMessages));
    box.appendChild(tile(st.files, (S.statFiles || "files") + " · " + st.size));
    box.appendChild(tile(fmt(st.loc), S.statLoc || "lines of code"));
    // complexity, coloured by level
    const cxColors = { low: "#5bb85b", medium: "#d8c14a", high: "#e0913f", veryhigh: "#e0555f" };
    const cxLabel = (S.cx && S.cx[st.complexityLevel]) || st.complexityLevel || "—";
    const cxTile = tile(cxLabel, S.statComplexity || "complexity", (st.complexity || 0) + "/100");
    const cv = cxTile.querySelector(".v"); if (cv) cv.style.color = cxColors[st.complexityLevel] || "";
    box.appendChild(cxTile);
    // connections
    box.appendChild(tile(st.edges || 0,
      (S.statConnections || "connections") + " · " + (st.nodes || 0) + " " + (S.statNodes || "nodes"),
      (S.statIsolated || "isolated") + ": " + (st.isolated || 0) + (st.topNode ? "  ·  " + (S.statTop || "top") + ": " + st.topNode : "")));
    if (st.git) box.appendChild(tile(st.git.branch, st.git.changes === 0 ? (S.statClean || "clean") : (S.statChanges || "{0} changed").replace("{0}", st.git.changes), st.git.commit));
    box.appendChild(tile(st.last || "—", S.statLast || "last activity"));
    renderChart(st.languages);
  }
  function fmt(n) { return (n || 0).toLocaleString(); }
  const CHART_COLORS = ["#e0555f", "#e0913f", "#d8c14a", "#5bb85b", "#4aa6d8", "#7a6ff0", "#c46fd0", "#888a92"];
  function renderChart(langs) {
    const c = $("chart"); c.innerHTML = "";
    if (!langs || !langs.length) return;
    const max = Math.max.apply(null, langs.map((l) => l.lines).concat([1]));
    langs.forEach((l, i) => {
      const b = document.createElement("div"); b.className = "bar";
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = l.name;
      const tr = document.createElement("div"); tr.className = "track";
      const f = document.createElement("div"); f.className = "fill";
      f.style.width = Math.max(2, Math.round(l.lines / max * 100)) + "%"; f.style.background = CHART_COLORS[i % CHART_COLORS.length];
      tr.appendChild(f);
      const n = document.createElement("span"); n.className = "n"; n.textContent = fmt(l.lines);
      b.appendChild(nm); b.appendChild(tr); b.appendChild(n); c.appendChild(b);
    });
  }

  // ---------- publish progress ----------
  let pubHideTimer = null;
  function publishStatus(m) {
    const el = $("pubprogress"), txt = $("pubtext");
    clearTimeout(pubHideTimer);
    el.classList.remove("ok", "err");
    $("publish").disabled = m.state === "start" || m.state === "progress";

    if (m.state === "start") { el.style.display = "flex"; txt.textContent = S.publishing || "Publishing…"; }
    else if (m.state === "progress") { el.style.display = "flex"; if (m.text) txt.textContent = m.text; }
    else if (m.state === "done") { el.style.display = "flex"; el.classList.add("ok"); txt.textContent = S.publishDone || "Published."; pubHideTimer = setTimeout(() => { el.style.display = "none"; }, 4000); }
    else if (m.state === "error") { el.style.display = "flex"; el.classList.add("err"); txt.textContent = m.text || (S.publishFailed || "Publish failed."); pubHideTimer = setTimeout(() => { el.style.display = "none"; }, 8000); }
  }

  // ---------- sources ----------
  function renderSources(list) {
    const box = $("sources"); box.innerHTML = "";
    if (!list || list.length === 0) { const e = document.createElement("div"); e.className = "empty"; e.textContent = S.srcNone || ""; box.appendChild(e); return; }
    for (const s of list) {
      const row = document.createElement("div"); row.className = "src";
      const ic = document.createElement("span"); ic.className = "g"; ic.textContent = SRCG[s.kind] || SRCG.Local;
      const mid = document.createElement("div"); mid.className = "grow";
      const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = s.name;
      const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = s.kind === "GitHub" && s.repo ? s.repo : s.path;
      mid.appendChild(nm); mid.appendChild(sub);
      const badge = document.createElement("span"); badge.className = "badge"; badge.dataset.src = s.id;
      row.appendChild(ic); row.appendChild(mid); row.appendChild(badge);
      const act = (glyph, tip, fn) => { const bt = document.createElement("button"); bt.className = "act"; bt.title = tip || ""; bt.textContent = glyph; bt.onclick = fn; row.appendChild(bt); };
      if (s.kind === "VisualStudio") act(g(0xE943), S.srcOpenVs || "", () => post({ t: "openInVs", id: s.id }));
      if (s.kind === "GitHub" && !s.path) act(g(0xE896), S.srcClone || "", () => post({ t: "cloneSource", id: s.id }));
      act(g(0xE8A7), S.srcOpen || "", () => post({ t: "openSource", id: s.id }));
      act(g(0xE74D), S.srcRemove || "", () => post({ t: "removeSource", id: s.id }));
      box.appendChild(row);
    }
  }

  // ---------- markdown ----------
  // Read-only rendered Markdown; editing happens in the expanded view (the file editor).
  const mdView = $("mdview"), mdEmpty = $("mdempty");
  function showInfo(html) {
    mdView.innerHTML = html || "";
    mdEmpty.style.display = (html && html.trim()) ? "none" : "block";
    mdEmpty.textContent = S.infoEmpty || "";
  }
  $("expandInfo").onclick = () => post({ t: "expandInfo" });

  // ---------- graph ----------
  function applyView() { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`; }
  function toWorld(cx, cy) { const r = graphEl.getBoundingClientRect(); return { x: (cx - r.left - view.x) / view.z, y: (cy - r.top - view.y) / view.z }; }

  function renderGraph() {
    for (const el of nodeEls.values()) el.remove(); nodeEls.clear();
    for (const n of state.nodes) world.appendChild(nodeEl(n));
    drawEdges(); applyView();
  }
  function nodeEl(n) {
    const d = document.createElement("div"); d.className = "node" + (sel && sel.type === "node" && sel.id === n.id ? " sel" : "");
    d.style.left = n.x + "px"; d.style.top = n.y + "px"; if (n.color) d.style.borderLeftColor = n.color; d.dataset.id = n.id;
    const top = document.createElement("div"); top.className = "top";
    const ic = document.createElement("span"); ic.className = "nic"; ic.textContent = KG[n.kind] || KG.note;
    const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = n.label || ((S.kinds && S.kinds[n.kind]) || "Note");
    top.appendChild(ic); top.appendChild(lbl); d.appendChild(top);
    const kind = document.createElement("div"); kind.className = "kind"; kind.textContent = (S.kinds && S.kinds[n.kind]) || n.kind; d.appendChild(kind);
    const port = document.createElement("div"); port.className = "port"; d.appendChild(port);
    port.addEventListener("pointerdown", (e) => startConnect(e, n));
    d.addEventListener("pointerdown", (e) => startNodeDrag(e, n, d));
    nodeEls.set(n.id, d); return d;
  }
  function rectOf(id) { const el = nodeEls.get(id), n = state.nodes.find((x) => x.id === id); if (!el || !n) return null;
    return { cx: n.x + el.offsetWidth / 2, cy: n.y + el.offsetHeight / 2, w: el.offsetWidth, h: el.offsetHeight }; }
  function border(r, tx, ty) { const dx = tx - r.cx, dy = ty - r.cy; if (dx === 0 && dy === 0) return { x: r.cx, y: r.cy };
    const s = (Math.abs(dx) * r.h > Math.abs(dy) * r.w) ? (r.w / 2) / Math.abs(dx) : (r.h / 2) / Math.abs(dy); return { x: r.cx + dx * s, y: r.cy + dy * s }; }
  function drawEdges() {
    svg.textContent = "";
    for (const e of state.edges) {
      const a = rectOf(e.from), b = rectOf(e.to); if (!a || !b) continue;
      const p1 = border(a, b.cx, b.cy), p2 = border(b, a.cx, a.cy);
      const color = e.color || "var(--accent)", selk = sel && sel.type === "edge" && sel.id === e.id;

  graphEl.addEventListener("pointerdown", (e) => {

      a = Math.min(a, n.x); b = Math.min(b, n.y); c = Math.max(c, n.x + w); d = Math.max(d, n.y + h); }

  }

  function customColors() { try { return JSON.parse(localStorage.getItem("rb.customColors") || "[]"); } catch (_) { return []; } }
  function saveCustom(c) { if (!c || c[0] !== "#" || PALETTE.includes(c)) return; const list = customColors(); if (!list.includes(c)) { list.push(c); while (list.length > 12) list.shift(); localStorage.setItem("rb.customColors", JSON.stringify(list)); } }

  $("addNode").onclick = (ev) => { ev.stopPropagation(); menu.innerHTML = "";
    const note = h("div", "mi"); note.appendChild(Object.assign(h("span", "nic"), { textContent: KG.note })); note.appendChild(h("span", null, S.note || "Note"));
    note.onclick = () => { addNode("note", "", ""); hideMenu(); }; menu.appendChild(note);
